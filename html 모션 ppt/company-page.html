alue":[{"_key":"ko","_type":"internationalizedArrayStringValue","value":"상품 소싱 및 공급<br class=\"split\"/> 상품정보 및 공급업체 등록 관리<br class=\"split\"/>물류 및 구매 프로세스 지원<br class=\"split\"/>무역 CS기획 및 VOC 관리"},{"_key":"en","_type":"internationalizedArrayStringValue","value":"Product sourcing and supply<br class=\"split\"/>Product information and supplier registration management<br class=\"split\"/>Logistics and procurement process support<br class=\"split\"/>Trade CS planning and VOC management"}]},{"_key":"27860d4ab517","_type":"textArrayType","id":"procurement-quote-text-array","list":[{"_key":"9eef1467696d","_type":"textType","id":"procurement-quote-text-array-0","value":[{"_key":"ko","_type":"internationalizedArrayStringValue","value":"풍부한 공급사 POOL을 통해 고객에게 최적의<br class=\"d-block-pc\"/> 구매서비스를 제공합니다."},{"_key":"en","_type":"internationalizedArrayStringValue","value":"We provide optimal purchasing services to customers by leveraging our extensive supplier pool."}]}]},{"_key":"ffab2cf6bf7e","_type":"textArrayType","id":"procurement-job-text-array","list":[{"_key":"40ea8b444b2d","_type":"textType","id":"procurement-job-text-array-0","value":[{"_key":"ko","_type":"internationalizedArrayStringValue","value":"G-MRO - 박민구"},{"_key":"en","_type":"internationalizedArrayStringValue","value":"G-MRO - Park Min-gu"}]}]},{"_key":"94790b21ab40","_type":"imgArrayType","id":"procurement-profile-img-array","list":[{"_key":"3ef8f7bbcb2f","_type":"imgType","id":"procurement-profile-img-array-0","image":{"_type":"image","alt":[{"_key":"ko","_type":"internationalizedArrayStringValue","value":"G-MRO - 박민구"},{"_key":"en","_type":"internationalizedArrayStringValue","value":"G-MRO – Park Min-gu"}],"asset":{"_ref":"/image/careers/jobdescriptions/section-careers-jobdescriptions-procurement-23.webp","_type":"reference"}}}]},{"_key":"79da2756e5b6","_type":"linkArrayType","id":"procurement-button-link-array","list":[{"_key":"80d63df25872","_type":"linkType","id":"procurement-button-link-array-0","label":[{"_key":"ko","_type":"internationalizedArrayStringValue","value":"인터뷰 자세히 보기"},{"_key":"en","_type":"internationalizedArrayStringValue","value":"View Detailed Interview"}],"link":{"target":"_self"}}]},{"_key":"3dcb58510c8b","_type":"textArrayType","id":"procurement-title-text-array","list":[{"_key":"46f8c820f789","_type":"textType","id":"procurement-title-text-array-0","value":[{"_key":"ko","_type":"internationalizedArrayStringValue","value":"G-MRO팀은"},{"_key":"en","_type":"internationalizedArrayStringValue","value":"About the G-MRO Team"}]},{"_key":"60eb81cea52e","_type":"textType","id":"procurement-title-text-array-1","value":[{"_key":"ko","_type":"internationalizedArrayStringValue","value":"본인이 속한 팀의 역할은 무엇인가요?"},{"_key":"en","_type":"internationalizedArrayStringValue","value":"What is your team's role?"}]},{"_key":"8ac7edb26ee1","_type":"textType","id":"procurement-title-text-array-2","value":[{"_key":"ko","_type":"internationalizedArrayStringValue","value":"소속한 팀에서 맡고 있는 업무는 무엇인가요?"},{"_key":"en","_type":"internationalizedArrayStringValue","value":"What are your responsibilities?"}]},{"_key":"2add2fd64c96","_type":"textType","id":"procurement-title-text-array-3","value":[{"_key":"ko","_type":"internationalizedArrayStringValue","value":"이 직무의 매력은 무엇인가요?"},{"_key":"en","_type":"internationalizedArrayStringValue","value":"What makes this role attractive?"}]},{"_key":"aebc0a165695","_type":"textType","id":"procurement-title-text-array-4","value":[{"_key":"ko","_type":"internationalizedArrayStringValue","value":"해당 직무를 수행하기 위해 필요한 역량은 무엇인가요?"},{"_key":"en","_type":"internationalizedArrayStringValue","value":"What competencies are needed for this role?"}]},{"_key":"071ad2a5810f","_type":"textType","id":"procurement-title-text-array-5","value":[{"_key":"ko","_type":"internationalizedArrayStringValue","value":"함께 일하게 될 미래의 동료들에게 조언"},{"_key":"en","_type":"internationalizedArrayStringValue","value":"Advice to future colleagues"}]}]},{"_key":"dbc595979fac","_type":"textArrayType","id":"procurement-popup-text-array","list":[{"_key":"6a0084270461","_type":"textType","id":"procurement-popup-text-array-0","value":[{"_key":"ko","_type":"internationalizedArrayStringValue","value":"품목 전문성과, 풍부한 공급사 POOL을 통해 고객에게 최적의 구매서비스을 제공하는 핵심 부서입니다."},{"_key":"en","_type":"internationalizedArrayStringValue","value":"We are a core department that provides optimal purchasing services based on our product expertise and extensive supplier networks."}]},{"_key":"cf2d61eaed3f","_type":"textType","id":"procurement-popup-text-array-1","value":[{"_key":"ko","_type":"internationalizedArrayStringValue","value":"회사의 필수적인 소모품을 구매 공급하는 핵심 부서입니다. 사무, 안전, 기계 세 가지 파트로 구성되어 있으며 품목 전문성과, 풍부한 공급사 POOL을 통해 고객에게 최적의 구매서비스을 제공합니다. 각종 산업현장(중공업, 반도체, 건설 등)뿐만 아니라 내근 업무가 이루어지는 사무실에서 필요한 소모성 자재 전반을 소싱하며, 산업재 오피스 전문지식을  바탕으로 구매컨설팅을 진행하고 있습니다."},{"_key":"en","_type":"internationalizedArrayStringValue","value":"We are a core department that supplies essential consumables for the company. Our department is divided into three parts—office, safety, and mechanical—to provide optimal purchasing services through our product expertise and extensive supplier networks. We source consumable materials for various industrial sites (including heavy industry, semiconductor, and construction) and office environments, while providing procurement consulting based on our industrial and office expertise."}]},{"_key":"438a660f0f33","_type":"textType","id":"procurement-popup-text-array-2","value":[{"_key":"ko","_type":"internationalizedArrayStringValue","value":"G-MRO팀에서 유니폼 구매 업무를 담당하고 있습니다.  고객사의 근무 환경과, Company Identity를 유니폼에 적용하고 디자인하며 입찰 수주, 생산, 운영, 납품, 정산 등 전 과정을 관리하고 있습니다."},{"_key":"en","_type":"internationalizedArrayStringValue","value":"I handle uniform procurement on the G-MRO team. This includes applying our customers’ work environments and Company Identity to the uniform design, and managing the entire process from winning the bid to production, operation, delivery, and settlement."}]},{"_key":"f54fbcf03918","_type":"textType","id":"procurement-popup-text-array-3","value":[{"_key":"ko","_type":"internationalizedArrayStringValue","value":"유니폼은 착용하는 환경이 어떤 곳인지, 다루는 재료는 무엇인지, 고객사의 성향은 어떤지에 따라 결과가 달라집니다.  따라서 스스로 주도권을 가지고 기획하는 업무를 체계적으로 배울 수 있습니다.  그리고 본인이 기획한 유니폼을 착용하는 근로자를 보았을 때 굉장한 뿌듯함을 느낄 수 있습니다!"},{"_key":"en","_type":"internationalizedArrayStringValue","value":"Uniforms vary significantly depending on the working environment, materials used, and client preferences. Working in this role has really helped me to learn self-directed planning. It's incredibly satisfying to see workers wearing uniforms that I've planned!"}]},{"_key":"455dd1d92f2a","_type":"textType","id":"procurement-popup-text-array-4","value":[{"_key":"ko","_type":"internationalizedArrayStringValue","value":"커뮤니케이션 능력이 가장 중요합니다.  고객사의 니즈를 직접 듣는 소통자의 역할을 함과 동시에 제조 공급사에 해당 내용을 지시하고, 생산 계획을 수립하기 때문에 구매자의 요청을 정확하게 파악하고  전달하는 능력이 매우 중요합니다. 추가로 의류·원단 관련 지식이 있다면 제안 영업을 할 때 조금 더 수월할 것 같지만 없어도 충분히 배울 수 있는 기회가 많습니다."},{"_key":"en","_type":"internationalizedArrayStringValue","value":"Communication skills are crucial. We need to accurately understand and convey buyers' requests, while both communicating with clients and directing the manufacturing of suppliers and establishing production plans. While knowledge of clothing and fabrics can help with sales proposals, there are plenty of opportunities to learn without prior experience."}]},{"_key":"4f6962a84f85","_type":"textType","id":"procurement-popup-text-array-5","value":[{"_key":"ko","_type":"internationalizedArrayStringValue","value":"아이마켓코리아는 다양한 기회가 열려있는 곳이라고 생각합니다. 그 만큼 성장할 수 있는 경험을 많이 할 수 있어서 재미도 있고 보람도 느낄 수 있습니다. "},{"_key":"en","_type":"internationalizedArrayStringValue","value":"iMarketKorea offers diverse opportunities. You will get the chance to have many growth experiences that can make work enjoyable and rewarding."}]}]},{"_key":"d4e1f48153dd","_type":"imgType","id":"procurement-desktop-img","image":{"_type":"image","alt":[{"_key":"ko","_type":"internationalizedArrayStringValue","value":"interview"},{"_key":"en","_type":"internationalizedArrayStringValue","value":"interview"}],"asset":{"_ref":"/image/careers/jobdescriptions/section-careers-jobdescriptions-procurement-24.webp","_type":"reference"}}},{"_key":"0fe316d493e6","_type":"imgType","id":"procurement-mobile-img","image":{"_type":"image","alt":[{"_key":"ko","_type":"internationalizedArrayStringValue","value":"interview"},{"_key":"en","_type":"internationalizedArrayStringValue","value":"interview"}],"asset":{"_ref":"/image/careers/jobdescriptions/section-careers-jobdescriptions-procurement-25.webp","_type":"reference"}}}],"description":"procurement-title-text :procurement 타이틀 텍스트\nprocurement-sub-text : procurement 서브 타이틀 텍스트\nprocurement-description-text : procurement 내용 텍스트\nprocurement-quote-text : procurement 인용구 텍스트\nprocurement-job-text : procurement 직무 텍스트\nprocurement-button-link : procurement 버튼 링크\nprocurement-profile-img :  procurement 프로필 이미지 \nprocurement-title-text-array:   procurement 팝업 제목 타이틀 텍스트 리스트\nprocurement-popup-text-array:   procurement 팝업 내용 타이틀 텍스트 리스트\nprocurement-desktop-array:   procurement 팝업 데스크톱 이미지\nprocurement-mobile-array:   procurement 팝업 모바일 이미지"},{"_key":"443df0c7c32c","_type":"section","component":"section-careers-jobdescriptions-planning","data":[{"_key":"acdb73e3f645","_type":"textType","id":"planning-title-text","value":[{"_key":"ko","_type":"internationalizedArrayStringValue","value":"기획"},{"_key":"en","_type":"internationalizedArrayStringValue","value":"Planning"}]},{"_key":"b2e5c64c3e6d","_type":"textType","id":"planning-sub-text","value":[{"_key":"ko","_type":"internationalizedArrayStringValue","value":"회사의 중장기 전략을 수립하고, <br/>신규 사업에 대한 시장 조사를 수행합니다."},{"_key":"en","_type":"internationalizedArrayStringValue","value":"We establish the company's mid-to-long-term strategies and conduct market research for new businesses."}]},{"_key":"d131583e6b93","_type":"textType","id":"planning-description-text","value":[{"_key":"ko","_type":"internationalizedArrayStringValue","value":"신규사업 기획<br class=\"split\"/>시장 조사<br class=\"split\"/>전략 수립"},{"_key":"en","_type":"internationalizedArrayStringValue","value":"New business planning<br class=\"split\"/>Market research<br class=\"split\"/>Strategy development"}]},{"_key":"bd8e163eefb6","_type":"textArrayType","id":"planning-quote-text-array","list":[{"_key":"902adfbf9030","_type":"textType","id":"planning-quote-text-array-0","value":[{"_key":"ko","_type":"internationalizedArrayStringValue","value":"고객과의 최초 커뮤니케이션을 성사시키고, 실제<br class=\"d-block-pc\"/> 거래가 시작되기 전까지의 모든 과정을 총괄합니다."},{"_key":"en","_type":"internationalizedArrayStringValue","value":"We manage all processes, from establishing initial customer communication until actual transactions begin."}]}]},{"_key":"c4bf281a298f","_type":"textArrayType","id":"planning-job-text-array","list":[{"_key":"f8cb047525d1","_type":"textType","id":"planning-job-text-array-0","value":[{"_key":"ko","_type":"internationalizedArrayStringValue","value":"서비스전략팀 - 예유미"},{"_key":"en","_type":"internationalizedArrayStringValue","value":"Service Strategy Team - Ye Yu-mi"}]}]},{"_key":"32c53427239a","_type":"imgArrayType","id":"planning-profile-img-array","list":[{"_key":"216b55b962c7","_type":"imgType","id":"planning-profile-img-array-0","image":{"_type":"image","alt":[{"_key":"ko","_type":"internationalizedArrayStringValue","value":"서비스전략팀 - 예유미"},{"_key":"en","_type":"internationalizedArrayStringValue","value":"Service Strategy Team – Ye Yu-mi"}],"asset":{"_ref":"/image/careers/jobdescriptions/section-careers-jobdescriptions-planning-26.webp","_type":"reference"}}}]},{"_key":"79c703d6eb86","_type":"linkArrayType","id":"planning-button-link-array","list":[{"_key":"58bfbdbac6ea","_type":"linkType","id":"planning-button-link-array-0","label":[{"_key":"ko","_type":"internationalizedArrayStringValue","value":"인터뷰 자세히 보기"},{"_key":"en","_type":"internationalizedArrayStringValue","value":"View Detailed Interview"}],"link":{"target":"_self"}}]},{"_key":"8d352ba7168d","_type":"textArrayType","id":"planning-title-text-array","list":[{"_key":"49716fd0dcb8","_type":"textType","id":"planning-title-text-array-0","value":[{"_key":"ko","_type":"internationalizedArrayStringValue","value":"서비스전략팀은"},{"_key":"en","_type":"internationalizedArrayStringValue","value":"About the Service Strategy Team"}]},{"_key":"fca47302711f","_type":"textType","id":"planning-title-text-array-1","value":[{"_key":"ko","_type":"internationalizedArrayStringValue","value":"본인이 속한 팀의 역할은 무엇인가요?"},{"_key":"en","_type":"internationalizedArrayStringValue","value":"What is your team's role?"}]},{"_key":"af9d74ff04c7","_type":"textType","id":"planning-title-text-array-2","value":[{"_key":"ko","_type":"internationalizedArrayStringValue","value":"소속한 팀에서 맡고 있는 업무는 무엇인가요?"},{"_key":"en","_type":"internationalizedArrayStringValue","value":"What are your responsibilities?"}]},{"_key":"5fa00a47901f","_type":"textType","id":"planning-title-text-array-3","value":[{"_key":"ko","_type":"internationalizedArrayStringValue","value":"이 직무의 매력은 무엇인가요?"},{"_key":"en","_type":"internationalizedArrayStringValue","value":"What makes this role attractive?"}]},{"_key":"aa0bdc81fac6","_type":"textType","id":"planning-title-text-array-4","value":[{"_key":"ko","_type":"internationalizedArrayStringValue","value":"해당 직무를 수행하기 위해 필요한 역량은 무엇인가요?"},{"_key":"en","_type":"internationalizedArrayStringValue","value":"What competencies are needed for this role?"}]},{"_key":"2b113eac7fc1","_type":"textType","id":"planning-title-text-array-5","value":[{"_key":"ko","_type":"internationalizedArrayStringValue","value":"함께 일하게 될 미래의 동료들에게 조언"},{"_key":"en","_type":"internationalizedArrayStringValue","value":"Advice to future colleagues"}]}]},{"_key":"b89eea52dfa9","_type":"textArrayType","id":"planning-popup-text-array","list":[{"_key":"6ddafc45ee4d","_type":"textType","id":"planning-popup-text-array-0","value":[{"_key":"ko","_type":"internationalizedArrayStringValue","value":"아이마켓코리아와 고객과의 관계를 최초로 쌓기 시작하는 주춧돌 역할을 합니다."},{"_key":"en","_type":"internationalizedArrayStringValue","value":"We are the cornerstone in the initial relationship-building between iMarketKorea and its customers."}]},{"_key":"71524c4ed02c","_type":"textType","id":"planning-popup-text-array-1","value":[{"_key":"ko","_type":"internationalizedArrayStringValue","value":"고객과의 최초 커뮤니케이션을 성사시키고, 실제 계약이 성립되기 전까지의 모든 과정을 총괄하고 있습니다. 입찰, 계약 등을 통해 고객사와 계약을 체결하며, 구매 프로세스 및 시스템을 셋업하여 운영을 시작하기까지의 모든 단계에 참여하고 있습니다."},{"_key":"en","_type":"internationalizedArrayStringValue","value":"We manage all processes, from establishing initial customer communication until contract finalization. We participate in every stage, from bidding and contracting with clients to setting up and launching procurement processes and systems."}]},{"_key":"daffd4c3e84a","_type":"textType","id":"planning-popup-text-array-2","value":[{"_key":"ko","_type":"internationalizedArrayStringValue","value":"고객과 데이터 분석 및 인터뷰를 통하여 기존의 구매 프로세스 현황과 이슈를 파악하고, 아이마켓코리아의 역할과 연결하여 효율적으로 운영할 수 있는 새로운 프로세스를 만들어 내는 업무를 맡고 있습니다."},{"_key":"en","_type":"internationalizedArrayStringValue","value":"I analyze data and conduct customer interviews to understand existing procurement processes and issues. Then, I create new, more efficient processes, by connecting them with iMarketKorea's capabilities."}]},{"_key":"9b265dd7c357","_type":"textType","id":"planning-popup-text-array-3","value":[{"_key":"ko","_type":"internationalizedArrayStringValue","value":"가장 큰 매력은, 고객사 맞춤 프로세스를 설계하기 때문에 매번 새로운 결과물을 만들어 내는 재미가 있다는 것 입니다. 그리고 이렇게 함께 맞춤형 프로세스를 설계하고 실무에 도움을 줄 때 큰 보람을 느낍니다. 다양한 산업군에 속해 있는 회사들의 구매 프로세스를 디테일하게 알 수 있는 기회는 흔치 않습니다. 프로젝트마다 새로운 경험을 쌓고 insight를 통한 역량을 키울 수 있습니다."},{"_key":"en","_type":"internationalizedArrayStringValue","value":"For me, the most appealing aspect is that I can create new solutions each time while designing customer-specific processes. It's rewarding to design customized processes that help practical operations. It's rare to have so many opportunities to learn detailed procurement processes across various industries. Each project builds new experiences, and develops my insights through new perspectives."}]},{"_key":"4ff6c0764726","_type":"textType","id":"planning-popup-text-array-4","value":[{"_key":"ko","_type":"internationalizedArrayStringValue","value":"특별히 필요한 전공지식은 없습니다. 우리 회사의 고객사 특성에 맞춰 서비스를 이해할 수 있어야 하고, 같은 상황을 다양한 시각으로 생각할 수 있는 역량이 필요할 것 같습니다. 또한 다양한 부서와 co-work 하는 과제가 있기 때문에 협업 능력이 중요하다고 생각합니다."},{"_key":"en","_type":"internationalizedArrayStringValue","value":"No specific major is required. You need to understand our services, the characteristics of our clients, and be able to view situations from multiple perspectives. Collaboration skills are vital, as we work with various departments."}]},{"_key":"2363c52a8602","_type":"textType","id":"planning-popup-text-array-5","value":[{"_key":"ko","_type":"internationalizedArrayStringValue","value":"저희 팀은 짧은 경험을 하고 다양한 분야에 빠르게 눈높이를 맞출 만한 관심을 가지고 있는 분이 적합하다고 생각합니다. 익숙하지 않은 새로운 경험을 환영하는 것을 즐길 수 있는 동료들과 함께 일하기를 기대합니다."},{"_key":"en","_type":"internationalizedArrayStringValue","value":"Our team suits those who can quickly adapt to diverse fields. We look forward to working with colleagues who enjoy embracing new experiences."}]}]},{"_key":"97e7488032b4","_type":"imgType","id":"planning-desktop-img","image":{"_type":"image","alt":[{"_key":"ko","_type":"internationalizedArrayStringValue","value":"서비스전략팀 - 예유미"},{"_key":"en","_type":"internationalizedArrayStringValue","value":"Service Strategy Team – Ye Yu-mi"}],"asset":{"_ref":"/image/careers/jobdescriptions/section-careers-jobdescriptions-planning-27.webp","_type":"reference"}}},{"_key":"93b4522415a9","_type":"imgType","id":"planning-mobile-img","image":{"_type":"image","alt":[{"_key":"ko","_type":"internationalizedArrayStringValue","value":"서비스전략팀 - 예유미"},{"_key":"en","_type":"internationalizedArrayStringValue","value":"Service Strategy Team – Ye Yu-mi"}],"asset":{"_ref":"/image/careers/jobdescriptions/section-careers-jobdescriptions-planning-28.webp","_type":"reference"}}}],"description":"planning-title-text :planning 타이틀 텍스트\nplanning-sub-text : planning 서브 타이틀 텍스트\nplanning-description-text : planning 내용 텍스트\nplanning-quote-text : planning 인용구 텍스트\nplanning-job-text : planning 직무 텍스트\nplanning-button-link : planning 버튼 링크\nplanning-profile-img :  planning 프로필 이미지 \nplanning-title-text-array:   planning 팝업 제목 타이틀 텍스트 리스트\nplanning-popup-text-array:  planning 팝업 내용 타이틀 텍스트 리스트\nplanning-desktop-array:   planning 팝업 데스크톱 이미지\nplanning-mobile-array:  planning 팝업 모바일 이미지"},{"_key":"7ba6632fa610","_type":"section","component":"section-careers-jobdescriptions-hr","data":[{"_key":"b64e0373edc3","_type":"textType","id":"hr-title-text","value":[{"_key":"ko","_type":"internationalizedArrayStringValue","value":"경영지원"},{"_key":"en","_type":"internationalizedArrayStringValue","value":"Business Support"}]},{"_key":"be0b00898c69","_type":"textType","id":"hr-sub-text","value":[{"_key":"ko","_type":"internationalizedArrayStringValue","value":"회계, 자금관리, 인사, 전자상거래 <br class=\"d-block-m\"/>시스템 기획 및 운영과 <br/>정보전략 업무를 수행합니다."},{"_key":"en","_type":"internationalizedArrayStringValue","value":"We perform accounting, fund management, HR, e-commerce system planning and operation, and information strategy tasks."}]},{"_key":"f7d5e50bb567","_type":"textType","id":"hr-description-text","value":[{"_key":"ko","_type":"internationalizedArrayStringValue","value":"회계<br class=\"split\"/>자금관리<br class=\"split\"/>전자상거래 시스템 기획<br class=\"split\"/>인사"},{"_key":"en","_type":"internationalizedArrayStringValue","value":"Accounting<br class=\"split\"/>Fund management<br class=\"split\"/>E-commerce system planning<br class=\"split\"/>Human resources"}]},{"_key":"5ea633b03ad1","_type":"textArrayType","id":"hr-quote-text-array","list":[{"_key":"8bc4cb2c97c4","_type":"textType","id":"hr-quote-text-array-0","value":[{"_key":"ko","_type":"internationalizedArrayStringValue","value":"기업 이해관계자들이<br class=\"d-block-pc\"/> 현명한 결정을 내릴 수 있도록 돕습니다."},{"_key":"en","_type":"internationalizedArrayStringValue","value":"We help stakeholders make informed decisions."}]},{"_key":"03086765f70c","_type":"textType","id":"hr-quote-text-array-1","value":[{"_key":"ko","_type":"internationalizedArrayStringValue","value":"시스템을 개선하여 회사의 업무효율성을<br class=\"d-block-pc\"/>  향상시키는 역할을 합니다."},{"_key":"en","_type":"internationalizedArrayStringValue","value":"We work to improve systems to enhance the company’s operational efficiency."}]}]},{"_key":"42aceb13c850","_type":"textArrayType","id":"hr-job-text-array","list":[{"_key":"50b030de67cc","_type":"textType","id":"hr-job-text-array-0","value":[{"_key":"ko","_type":"internationalizedArrayStringValue","value":"재무팀 - 최재근 "},{"_key":"en","_type":"internationalizedArrayStringValue","value":"Finance Team - Choi Jae-keun"}]},{"_key":"c839cb5119c1","_type":"textType","id":"hr-job-text-array-1","value":[{"_key":"ko","_type":"internationalizedArrayStringValue","value":"정보전략 - 최재웅 "},{"_key":"en","_type":"internationalizedArrayStringValue","value":"IT Strategy - Choi Jae-woong"}]}]},{"_key":"dece8d661fca","_type":"imgArrayType","id":"hr-profile-img-array","list":[{"_key":"0e08292494ca","_type":"imgType","id":"hr-profile-img-array-0","image":{"_type":"image","alt":[{"_key":"ko","_type":"internationalizedArrayStringValue","value":"재무팀 - 최재근 "},{"_key":"en","_type":"internationalizedArrayStringValue","value":"Finance Team - Choi Jae-keun"}],"asset":{"_ref":"/image/careers/jobdescriptions/section-careers-jobdescriptions-hr-29.webp","_type":"reference"}}},{"_key":"b793a3a118d0","_type":"imgType","id":"hr-profile-img-array-1","image":{"_type":"image","alt":[{"_key":"ko","_type":"internationalizedArrayStringValue","value":"정보전략 - 최재웅 "},{"_key":"en","_type":"internationalizedArrayStringValue","value":"IT Strategy – Choi Jae-woong"}],"asset":{"_ref":"/image/careers/jobdescriptions/section-careers-jobdescriptions-hr-30.webp","_type":"reference"}}}]},{"_key":"33d24c075eba","_type":"linkArrayType","id":"hr-button-link-array","list":[{"_key":"2ee6caef4a29","_type":"linkType","id":"hr-button-link-array-0","label":[{"_key":"ko","_type":"internationalizedArrayStringValue","value":"인터뷰 자세히 보기"},{"_key":"en","_type":"internationalizedArrayStringValue","value":"View Detailed Interview"}],"link":{"target":"_self"}},{"_key":"5b6ea810f60d","_type":"linkType","id":"hr-button-link-array-1","label":[{"_key":"ko","_type":"internationalizedArrayStringValue","value":"인터뷰 자세히 보기"},{"_key":"en","_type":"internationalizedArrayStringValue","value":"View Detailed Interview"}],"link":{"target":"_self"}}]},{"_key":"26900e40cdab","_type":"textArrayType","id":"hr-title-text-array","list":[{"_key":"501167ada673","_type":"textType","id":"hr-title-text-array-0","value":[{"_key":"ko","_type":"internationalizedArrayStringValue","value":"재무팀은"},{"_key":"en","_type":"internationalizedArrayStringValue","value":"About the Finance Team"}]},{"_key":"128d6e17aec0","_type":"textType","id":"hr-title-text-array-1","value":[{"_key":"ko","_type":"internationalizedArrayStringValue","value":"본인이 속한 팀의 역할은 무엇인가요?"},{"_key":"en","_type":"internationalizedArrayStringValue","value":"What is your team's role?"}]},{"_key":"0c61bc521225","_type":"textType","id":"hr-title-text-array-2","value":[{"_key":"ko","_type":"internationalizedArrayStringValue","value":"소속한 팀에서 맡고 있는 업무는 무엇인가요?"},{"_key":"en","_type":"internationalizedArrayStringValue","value":"What are your responsibilities?"}]},{"_key":"c2c6d8124531","_type":"textType","id":"hr-title-text-array-3","value":[{"_key":"ko","_type":"internationalizedArrayStringValue","value":"이 직무의 매력은 무엇인가요?"},{"_key":"en","_type":"internationalizedArrayStringValue","value":"What makes this role attractive?"}]},{"_key":"38778891314a","_type":"textType","id":"hr-title-text-array-4","value":[{"_key":"ko","_type":"internationalizedArrayStringValue","value":"해당 직무를 수행하기 위해 필요한 역량은 무엇인가요?"},{"_key":"en","_type":"internationalizedArrayStringValue","value":"What competencies are needed for this role?"}]},{"_key":"0e562fea6db4","_type":"textType","id":"hr-title-text-array-5","value":[{"_key":"ko","_type":"internationalizedArrayStringValue","value":"함께 일하게 될 미래의 동료들에게 조언"},{"_key":"en","_type":"internationalizedArrayStringValue","value":"Advice to future colleagues"}]}]},{"_key":"45fe31615373d2a80e5d6ca50f6723b1","_type":"textArrayType","id":"hr-title2-text-array","list":[{"_key":"501167ada673","_type":"textType","id":"hr-title2-text-array-0","value":[{"_key":"ko","_type":"internationalizedArrayStringValue","value":"정보전략팀은"},{"_key":"en","_type":"internationalizedArrayStringValue","value":"About the IT Strategy Team"}]},{"_key":"128d6e17aec0","_type":"textType","id":"hr-title2-text-array-1","value":[{"_key":"ko","_type":"internationalizedArrayStringValue","value":"본인이 속한 팀의 역할은 무엇인가요?"},{"_key":"en","_type":"internationalizedArrayStringValue","value":"What is your team's role?"}]},{"_key":"0c61bc521225","_type":"textType","id":"hr-title2-text-array-2","value":[{"_key":"ko","_type":"internationalizedArrayStringValue","value":"소속한 팀에서 맡고 있는 업무는 무엇인가요?"},{"_key":"en","_type":"internationalizedArrayStringValue","value":"What are your responsibilities?"}]},{"_key":"c2c6d8124531","_type":"textType","id":"hr-title2-text-array-3","value":[{"_key":"ko","_type":"internationalizedArrayStringValue","value":"이 직무의 매력은 무엇인가요?"},{"_key":"en","_type":"internationalizedArrayStringValue","value":"What makes this role attractive?"}]},{"_key":"38778891314a","_type":"textType","id":"hr-title2-text-array-4","value":[{"_key":"ko","_type":"internationalizedArrayStringValue","value":"해당 직무를 수행하기 위해 필요한 역량은 무엇인가요?"},{"_key":"en","_type":"internationalizedArrayStringValue","value":"What competencies are needed for this role?"}]},{"_key":"0e562fea6db4","_type":"textType","id":"hr-title2-text-array-5","value":[{"_key":"ko","_type":"internationalizedArrayStringValue","value":"함께 일하게 될 미래의 동료들에게 조언"},{"_key":"en","_type":"internationalizedArrayStringValue","value":"Advice to future colleagues"}]}]},{"_key":"4a9fbc6e46b6","_type":"textArrayType","id":"hr-popup-text-array","list":[{"_key":"5f782d03301f","_type":"textType","id":"hr-popup-text-array-0","value":[{"_key":"ko","_type":"internationalizedArrayStringValue","value":"회사의 재무 건전성과 지속적인 성장을 지원하는 부서입니다."},{"_key":"en","_type":"internationalizedArrayStringValue","value":"We support the company's financial soundness and continued growth."}]},{"_key":"63b2fd89abbe","_type":"textType","id":"hr-popup-text-array-1","value":[{"_key":"ko","_type":"internationalizedArrayStringValue","value":"영업 활동 전반의 리스크 관리 및 정확한 수익 인식을 통해 적시에 적정 정보를 제공하여 기업 이해관계자들이 합리적인 의사결정을 할 수 있도록 지원하고 있습니다."},{"_key":"en","_type":"internationalizedArrayStringValue","value":"We help stakeholders make rational decisions by providing timely and appropriate information through risk management of overall business activities and accurate recognition of revenue."}]},{"_key":"00a8396ae914","_type":"textType","id":"hr-popup-text-array-2","value":[{"_key":"ko","_type":"internationalizedArrayStringValue","value":"회사의 재무상태를 관리하거나, 원활한 영업활동을 지원하기 위해 매출을 실현 및 회계/세무 검토를 수행하는 등 다양한 업무를 경험하고 있습니다. 또한 아이마켓코리아는 IT 기반의 B2B 서비스를 제공하는 회사이기에 회계 데이터를 효율적으로 관리하기 위한 시스템 개선 노력도 병행하고 있습니다."},{"_key":"en","_type":"internationalizedArrayStringValue","value":"I handle various tasks, including managing financial status, realizing sales, and conducting accounting/tax reviews to support smooth business operations. As iMarketKorea is an IT-based B2B service company, we are also working on improving our systems for efficient management of accounting data."}]},{"_key":"dfaadf7edced","_type":"textType","id":"hr-popup-text-array-3","value":[{"_key":"ko","_type":"internationalizedArrayStringValue","value":"회사는 각 부서의 수많은 사람들이 활동을 통해서 운영됩니다. 재무팀은 회사 운영을 전체적으로 검토하기에, 다양한 관점에서 회사를 전반적으로 바라볼 수 있는 시야를 가질 수 있습니다. 또한, 직접 작성한 재무제표가 공시되어 주요 및 잠재적 투자자들에게 이용된다는 점에서 재무팀의 충분한 매력이 있습니다."},{"_key":"en","_type":"internationalizedArrayStringValue","value":"A company operates through the activities of numerous people across many departments. The finance team reviews company operations comprehensively, providing a broad perspective from various viewpoints. It's also rewarding to know that the financial statements we prepare are disclosed and used by current and potential investors."}]},{"_key":"555ca6fdf8e2","_type":"textType","id":"hr-popup-text-array-4","value":[{"_key":"ko","_type":"internationalizedArrayStringValue","value":"재무 팀 업무를 수행하기 위해서는 기본적으로 회계 및 세무에 대한 지식이 필요합니다. 다만, 회계/세무 지식 못지않게 중요한 것은 커뮤니케이션 능력입니다.  업무는 혼자서 하는 것이 아니라 유기적으로 연결되어 있기에, 재무팀 내·외부적으로 원활한 커뮤니케이션이 매우 중요합니다."},{"_key":"en","_type":"internationalizedArrayStringValue","value":"Basic accounting and tax knowledge is essential for the finance team’s work. But the ability to communicate is equally important. Since work is not done in isolation but is organically connected, smooth communication within and outside the finance team is crucial."}]},{"_key":"cbe484f78816","_type":"textType","id":"hr-popup-text-array-5","value":[{"_key":"ko","_type":"internationalizedArrayStringValue","value":"본인이 꼼꼼하고 신뢰할 수 있으며, 원활한 협력 하에서 소통하는 것을 선호하는 분들이라면 재무팀 업무에 적합하실 것이라고 생각합니다. 그리고 재무/회계 관련 업무를 경험할 수 있는 팀원과 함께 할 것입니다. 아이마켓코리아는 지속적으로 신규 사업을 진행하고 있기 때문에 새로운 시각에서의 회사/서비스 지원이 요구되고 있습니다. 이러한 맥락 속에서 아이마켓코리아 재무팀의 미래의 동료들과 함께 상호작용할 수 있는 날을 기다리고 있습니다."},{"_key":"en","_type":"internationalizedArrayStringValue","value":"You'll be well-suited for the finance team if you are detail-oriented and trustworthy and prefer communicating through smooth collaboration. You'll work alongside team members who are experienced in finance and accounting. As iMarketKorea is continuously developing new businesses, we need fresh perspectives for company and service support. In this context, we look forward to interacting with future colleagues in the iMarketKorea finance team."}]}]},{"_key":"9910af125f44aefbb35857523f5e9ea8","_type":"textArrayType","id":"hr-popup2-text-array","list":[{"_key":"5f782d03301f","_type":"textType","id":"hr-popup2-text-array-0","value":[{"_key":"ko","_type":"internationalizedArrayStringValue","value":"아이마켓코리아에서 사용하는 모든 시스템을 관리 및 운영하고 회사와 고객의 니즈, 변화되는 IT 트렌드에 맞춰 발빠르게 움직이는 부서입니다."},{"_key":"en","_type":"internationalizedArrayStringValue","value":"We manage and operate all systems used at iMarketKorea, responding quickly to company and customer needs and changing IT trends."}]},{"_key":"63b2fd89abbe","_type":"textType","id":"hr-popup2-text-array-1","value":[{"_key":"ko","_type":"internationalizedArrayStringValue","value":"구매, 영업, 물류, 재무 등 회사의 모든 업무 프로세스 전반에 걸친 시스템의 안정적인 운영 역할, 고객의 니즈 및 이슈를 해결하고 정보보안관리를 하여 사고를 방지하는 역할, 시스템을 개선하여 회사의 업무효율을 향상시키는 역할 등 IT 전반적인 모든 업무를 수행합니다. 또한 정보화 전략을 수립하여 최적의 IT환경을 구성하는 것이 팀의 역할을 합니다."},{"_key":"en","_type":"internationalizedArrayStringValue","value":"We handle all IT-related tasks, including the stable operation of systems across business processes (purchasing, sales, logistics, finance), resolving customer needs and issues while preventing incidents through information security management, and improving systems to enhance operational efficiency. We also establish IT strategies to create the optimal IT environments."}]},{"_key":"d05894511e3f","_type":"textType","id":"hr-popup2-text-array-2","value":[{"_key":"ko","_type":"internationalizedArrayStringValue","value":"정보전략팀의 업무는 크게 시스템 기획/운영, 시스템 개발, 아키텍쳐/보안으로 나눌 수 있습니다. 저는 아이마켓코리아의 B2B 거래시스템인 IMMKMALL, ERP시스템인 SAP의 프로세스 관리와 이슈 해결을 하는 시스템 기획/운영 업무를 수행하고 있습니다."},{"_key":"en","_type":"internationalizedArrayStringValue","value":"The IT Strategy team's work includes system planning/operations, system development, and architecture/security. I manage processes and resolve issues for IMMKMALL (our B2B trading system) and SAP (ERP system)."}]},{"_key":"eac8f85935c9","_type":"textType","id":"hr-popup2-text-array-3","value":[{"_key":"ko","_type":"internationalizedArrayStringValue","value":"IT기술의 변화, 운영되는 IT 프로세스 및 시스템을 체계적으로 경험할 수 있고 기업의 비즈니스를 이해하고 시스템을 기획하고 설계하여 운영되는 IT 전문가로 성장할 수 있습니다. 또한 정보화 과제나 수행 및 전략을 수립하면서 정보보안 및 관리를 통해 회사의 전문가로서 역할을 다할 수 있습니다."},{"_key":"en","_type":"internationalizedArrayStringValue","value":"You can systematically experience IT technology changes, operational processes, and systems while growing as an IT expert who understands business needs and designs systems. You can also fulfill your role as a company expert through information security management while establishing IT strategies."}]},{"_key":"463775090695","_type":"textType","id":"hr-popup2-text-array-4","value":[{"_key":"ko","_type":"internationalizedArrayStringValue","value":"필요한 역량으로는 프로세스를 이해하고 개선점을 도출할 수 있는 분석력, 시스템 운영과 보안 등 업무에 필요한 전반적인 IT지식, 다양한 부서 및 고객사와 협업할 수 있는 창의적 마인드와 적절한 커뮤니케이션 스킬이 필요합니다. 또한 문제를 분석해 원인, 보안위험에 신속히 대응하고, 프로젝트 관리 등 의사결정이 필요할 때 최적의 대응과 통찰력을 가질 수 있는 능력을 키워야 합니다. 특히 IT지식 습득과 변화되는 IT 트렌드를 민감하게 파악하여 관련된 분야에 대한 지속적인 학습이 필요합니다. 업무와 관련된 전문지식은 컴퓨터공학, 소프트웨어공학, 정보통신공학 등이 있으며, 반드시 해당 전공이 아니어도 업무를 배워서 진행할 수 있습니다."},{"_key":"en","_type":"internationalizedArrayStringValue","value":"The competencies required include the analytical skills needed to understand processes and identify improvements, general IT knowledge of system operations and security, a creative mindset, and communication skills for collaboration with various departments and clients. You also need the ability to respond quickly to problems and security risks, and make optimal decisions with insight into project management. Continuous learning is essential in order to stay current with IT knowledge and changing trends. Related expertise includes computer science, software engineering, and information communications engineering, though these specific majors aren't required."}]},{"_key":"15e15b19fa1b","_type":"textType","id":"hr-popup2-text-array-5","value":[{"_key":"ko","_type":"internationalizedArrayStringValue","value":"아이마켓코리아는 MRO업체 중에서도 IT 역량을 가지고 있는 회사입니다. 다양한 부서에서 높은 이해와 이와 같은 관심을 갖고 있습니다. 정보전략팀에서도 여러가지 업무와 니즈를 이해하고 설계할 수 있으며 다양한 시스템 및 전략을 경험해 볼 수 있는 동료들이 함께하게 될 수 있을 것입니다. 시간이 지날수록 IT기술이 발전하여 시스템의 중요성이 더 커질 수 있으나, RPA 등 시스템에 대한 관심이 많고 역량을 가지고자 한다면 정보전략팀에서 많은 경험을 해보고 전문가가 될 수 있을 것입니다. 정보전략팀의 동료들과 상호작용을 통해 성장할 수 있는 날을 기대하고 있습니다."},{"_key":"en","_type":"internationalizedArrayStringValue","value":"iMarketKorea stands out among MRO companies for its IT capabilities. Working on the IT Strategy team gives one the opportunity to understand various business needs and experience diverse systems and strategies. As IT becomes increasingly important, those interested in systems like RPA can gain valuable experience and become experts here. We look forward to growing together through interacting with team members."}]}]},{"_key":"5a904b171540","_type":"imgType","id":"hr-desktop-img","image":{"_type":"image","alt":[{"_key":"ko","_type":"internationalizedArrayStringValue","value":"재무팀 - 최재근 "},{"_key":"en","_type":"internationalizedArrayStringValue","value":"Finance Team – Choi Jae-keun"}],"asset":{"_ref":"/image/careers/jobdescriptions/section-careers-jobdescriptions-hr-31.webp","_type":"reference"}}},{"_key":"84378378d970ee3d3dd09c5ebc1ada87","_type":"imgType","id":"hr-desktop2-img","image":{"_type":"image","alt":[{"_key":"ko","_type":"internationalizedArrayStringValue","value":"정보전략 - 최재웅 "},{"_key":"en","_type":"internationalizedArrayStringValue","value":"IT Strategy – Choi Jae-woong"}],"asset":{"_ref":"/image/careers/jobdescriptions/section-careers-jobdescriptions-hr-32.webp","_type":"reference"}}},{"_key":"075b13bf7f7a","_type":"imgType","id":"hr-mobile-img","image":{"_type":"image","alt":[{"_key":"ko","_type":"internationalizedArrayStringValue","value":"재무팀 - 최재근 "},{"_key":"en","_type":"internationalizedArrayStringValue","value":"Finance Team – Choi Jae-keun"}],"asset":{"_ref":"/image/careers/jobdescriptions/section-careers-jobdescriptions-hr-33.webp","_type":"reference"}}},{"_key":"d9ff63b3a15e1caff8e42600b229b3c7","_type":"imgType","id":"hr-mobile2-img","image":{"_type":" "}],"asset":{"_ref":"/image/careers/jobdescriptions/section-careers-jobdescriptions-sales-36.webp","_type":"reference"}}}]},{"_key":"2f24556735ab","_type":"linkArrayType","id":"sales-button-link-array","list":[{"_key":"74965b998673","_type":"linkType","id":"sales-button-link-array-0","label":[{"_key":"ko","_type":"internationalizedArrayStringValue","value":"인터뷰 자세히 보기"},{"_key":"en","_type":"internationalizedArrayStringValue","value":"View Detailed Interview"}],"link":{"target":"_self"}},{"_key":"331bd194b5a6","_type":"linkType","id":"sales-button-link-array-1","label":[{"_key":"ko","_type":"internationalizedArrayStringValue","value":"인터뷰 자세히 보기"},{"_key":"en","_type":"internationalizedArrayStringValue","value":"View Detailed Interview"}],"link":{"target":"_self"}}]},{"_key":"a7de24c8cb5d","_type":"textArrayType","id":"sales-title-text-array","list":[{"_key":"b20c7e9c0041","_type":"textType","id":"sales-title-text-array-0","value":[{"_key":"ko","_type":"internationalizedArrayStringValue","value":"중부영업팀은"},{"_key":"en","_type":"internationalizedArrayStringValue","value":"About the Central Sales Team"}]},{"_key":"fdcd197fd4d1","_type":"textType","id":"sales-title-text-array-1","value":[{"_key":"ko","_type":"internationalizedArrayStringValue","value":"본인이 속한 팀의 역할은 무엇인가요?"},{"_key":"en","_type":"internationalizedArrayStringValue","value":"What is your team's role?"}]},{"_key":"ea05c4c49a0b","_type":"textType","id":"sales-title-text-array-2","value":[{"_key":"ko","_type":"internationalizedArrayStringValue","value":"소속한 팀에서 맡고 있는 업무는 무엇인가요?"},{"_key":"en","_type":"internationalizedArrayStringValue","value":"What are your responsibilities?"}]},{"_key":"2f577c54f093","_type":"textType","id":"sales-title-text-array-3","value":[{"_key":"ko","_type":"internationalizedArrayStringValue","value":"이 직무의 매력은 무엇인가요?"},{"_key":"en","_type":"internationalizedArrayStringValue","value":"What makes this role attractive?"}]},{"_key":"4e2015eab8b4","_type":"textType","id":"sales-title-text-array-4","value":[{"_key":"ko","_type":"internationalizedArrayStringValue","value":"해당 직무를 수행하기 위해 필요한 역량은 무엇인가요?"},{"_key":"en","_type":"internationalizedArrayStringValue","value":"What competencies are needed for this role?"}]},{"_key":"fc258b3742ac","_type":"textType","id":"sales-title-text-array-5","value":[{"_key":"ko","_type":"internationalizedArrayStringValue","value":"함께 일하게 될 미래의 동료들에게 조언"},{"_key":"en","_type":"internationalizedArrayStringValue","value":"Advice to future colleagues"}]}]},{"_key":"e57b913b78ff7e6305d999a49e615f5b","_type":"textArrayType","id":"sales-title2-text-array","list":[{"_key":"b20c7e9c0041","_type":"textType","id":"sales-title2-text-array-0","value":[{"_key":"ko","_type":"internationalizedArrayStringValue","value":"해외사업팀은"},{"_key":"en","_type":"internationalizedArrayStringValue","value":"About the Overseas Business Team"}]},{"_key":"fdcd197fd4d1","_type":"textType","id":"sales-title2-text-array-1","value":[{"_key":"ko","_type":"internationalizedArrayStringValue","value":"본인이 속한 팀의 역할은 무엇인가요?"},{"_key":"en","_type":"internationalizedArrayStringValue","value":"What is your team's role?"}]},{"_key":"33cf6c08f007","_type":"textType","id":"sales-title2-text-array-2","value":[{"_key":"ko","_type":"internationalizedArrayStringValue","value":"소속한 팀에서 맡고 있는 업무는 무엇인가요?"},{"_key":"en","_type":"internationalizedArrayStringValue","value":"What are your responsibilities?"}]},{"_key":"0901e4c1d9f9","_type":"textType","id":"sales-title2-text-array-3","value":[{"_key":"ko","_type":"internationalizedArrayStringValue","value":"이 직무의 매력은 무엇인가요?"},{"_key":"en","_type":"internationalizedArrayStringValue","value":"What makes this role attractive?"}]},{"_key":"7d137b133921","_type":"textType","id":"sales-title2-text-array-4","value":[{"_key":"ko","_type":"internationalizedArrayStringValue","value":"해당 직무를 수행하기 위해 필요한 역량은 무엇인가요?"},{"_key":"en","_type":"internationalizedArrayStringValue","value":"What competencies are needed for this role?"}]},{"_key":"0b0ad8d80c4e","_type":"textType","id":"sales-title2-text-array-5","value":[{"_key":"ko","_type":"internationalizedArrayStringValue","value":"함께 일하게 될 미래의 동료들에게 조언"},{"_key":"en","_type":"internationalizedArrayStringValue","value":"Advice to future colleagues"}]}]},{"_key":"d9a397afce69","_type":"textArrayType","id":"sales-popup-text-array","list":[{"_key":"de7689631648","_type":"textType","id":"sales-popup-text-array-0","value":[{"_key":"ko","_type":"internationalizedArrayStringValue","value":"회사의 매출 확대를 위해 신규 BIZ 및 기회 발굴을 전개하고 있으며, 기존 고객과의 지속적인 거래를 위한 관계 관리 및 최상의 서비스를 제공하고 있습니다."},{"_key":"en","_type":"internationalizedArrayStringValue","value":"We develop new business opportunities and discover prospects for revenue growth while managing relationships with our existing customers to ensure continuous business and provide optimal service."}]},{"_key":"17e9fb6bd0f5","_type":"textType","id":"sales-popup-text-array-1","value":[{"_key":"ko","_type":"internationalizedArrayStringValue","value":"고객과 안정적이 거래를 운영하기 위한 전반적인 역할을 맡고 있습니다. 또한 매출 확대를 위한 프로젝트 진행 및 신규고객 영업을 전개하고 있습니다. 그 외에도 고객 관계 관리, 영업목표 수립, 이익 확대를 위한 프로세스 진단 및 개선 업무를 진행하고 있습니다."},{"_key":"en","_type":"internationalizedArrayStringValue","value":"We manage overall operations for stable customer transactions. We also develop projects for revenue growth and conduct new customer sales. In addition, we handle customer relationship management, set sales goals, and work on process diagnosis and improvement for profit expansion."}]},{"_key":"b9006128cc46","_type":"textType","id":"sales-popup-text-array-2","value":[{"_key":"ko","_type":"internationalizedArrayStringValue","value":"저는 고객사 영업 담당자로, 계약 관계를 안정적으로 운영될 수 있도록 전반적인 관리 및 신규 매출 확대를 위한 영업활동을 전개하고 있습니다. 또한 고객이 필요한 품목을 당사의 구매경쟁력을 바탕으로 최적의 품목을 제안하며, 고객이 니즈를 파악하여 경쟁력 있는 제품을 제안하고 있습니다. 그 외에도 운영 간 발생되는 이슈에 대한 처리 및 개선 업무, 영업목표 수립, 내부 매출 확대 및 영업이익 개선 업무를 수행하고 있습니다."},{"_key":"en","_type":"internationalizedArrayStringValue","value":"As a customer sales representative, I manage overall contract relationships and engage in sales activities for new revenue growth. I propose optimal items based on our company's competitive purchasing strategy while understanding customer needs and suggesting competitive products. I also handle operational issues and improvements, set sales targets, and work on internal revenue and profit improvement."}]},{"_key":"821d8dc09d97","_type":"textType","id":"sales-popup-text-array-3","value":[{"_key":"ko","_type":"internationalizedArrayStringValue","value":"정답이 없는 문제에 대해 정답을 만들어 가는 과정에서 가장 큰 매력을 느낍니다. 고객과 거래관계에선 예상치 않은 대/내외적 이슈가 발생됩니다. 해당 이슈에 당면하였을 때 원인 파악 및 고객에게 끼치는 영향에 대해 다양한 각도로 분석하여 최적의 대안을 제시하고, 더불어 해당 이슈가 추후 발생되지 않도록 후속조치를 취했을 때 가장 큰 매력을 느낍니다."},{"_key":"en","_type":"internationalizedArrayStringValue","value":"For me, the most appealing aspect is creating solutions for problems that need clear answers. Unexpected internal and external issues arise in customer relationships. When faced with such issues, I find it most rewarding to analyze the cause and impact from various angles, provide optimal alternatives, and take follow-up measures to prevent recurrence."}]},{"_key":"4ecc652c59b2","_type":"textType","id":"sales-popup-text-array-4","value":[{"_key":"ko","_type":"internationalizedArrayStringValue","value":"영업업무를 수행함에 있어 가장 중요한 역량은 협상력이라고 생각합니다. 고객을 상대해야하는 업무의 특성상 거래관계에 있는 고객과 협의해야 하는 여러 상황이 발생됩니다. 물론 고객의 관점에서 생각하고 협의를 하는 것이 중요하지만, 무엇보다 회사의 이익에 위배되지 않는 선에서 진행되어야 되기에 이를 조율하는 협상력이 가장 중요한 역량이라고 생각됩니다."},{"_key":"en","_type":"internationalizedArrayStringValue","value":"Negotiation skills are the most crucial competency in sales. The nature of customer-facing work means that we encounter various situations that require us to negotiate with clients. While it's important to consider the customer's perspective, negotiation skills are vital to balance this with company interests and ensure outcomes that don't compromise company profit."}]},{"_key":"df6f24b4bd6d","_type":"textType","id":"sales-popup-text-array-5","value":[{"_key":"ko","_type":"internationalizedArrayStringValue","value":"취업이 어려운 시대에 어렵게 취업한 미래의 동료에게 먼저 고생하였다고 말하고 싶고, 그 정도의 열정과 노력이면 회사에서 어떠한 일을 부여받더라고 잘할 거라 믿어 의심치 않습니다."},{"_key":"en","_type":"internationalizedArrayStringValue","value":"To the future colleagues who've worked hard to join us in these challenging times, I'm confident you'll excel at any task with the passion and effort you already possess."}]}]},{"_key":"95f104289820c56f870d8edf63988f6a","_type":"textArrayType","id":"sales-popup2-text-array","list":[{"_key":"de7689631648","_type":"textType","id":"sales-popup2-text-array-0","value":[{"_key":"ko","_type":"internationalizedArrayStringValue","value":"글로벌 고객에게 필요한 가치를 수출합니다."},{"_key":"en","_type":"internationalizedArrayStringValue","value":"We export the value our global customers need."}]},{"_key":"17e9fb6bd0f5","_type":"textType","id":"sales-popup2-text-array-1","value":[{"_key":"ko","_type":"internationalizedArrayStringValue","value":"회사의 해외사업관리의 전반적인 역할을 맡고 있습니다. 주로 해외 법인별 대상으로 물품 수출입을 하고 있으며, 그 외에도 영업 목표 수립과 제안, 실적 및 리스크 관리 등을 하고 있습니다."},{"_key":"en","_type":"internationalizedArrayStringValue","value":"We manage all aspects of overseas business operations. We primarily handle import and export with overseas subsidiaries, while setting sales targets, making proposals, and managing performance and risks."}]},{"_key":"87d2ab110a0c","_type":"textType","id":"sales-popup2-text-array-2","value":[{"_key":"ko","_type":"internationalizedArrayStringValue","value":"저는 해외고객사 영업 담당자, 고객과 공급사 사이에서 커뮤니케이션하고 소통하는 코디네이터라고 보시면 됩니다. 구체적으로는 영업 목표 수립, 영업 제안부터 거래처에 필요한 제품을 납품하고 수출 후 발생하는 이슈 처리까지 모든 과정을 책임지고 있습니다."},{"_key":"en","_type":"internationalizedArrayStringValue","value":"I am a sales representative for overseas clients and a coordinator who communicates with customers and suppliers. More specifically, I'm responsible for the entire process, from setting sales goals and making proposals to delivering products and handling post-export issues."}]},{"_key":"711b210926be","_type":"textType","id":"sales-popup2-text-array-3","value":[{"_key":"ko","_type":"internationalizedArrayStringValue","value":"글로벌 고객과 활발하게 소통하며, 고객에게 필요한 가치를 전달하는 데서 뿌듯함을 느낍니다. 아이마켓코리아의 일원으로서 회사가 World-Class 산업자재 유통서비스 회사로 나아가는 데 일조하고 있다는 생각에 감사하고 있습니다."},{"_key":"en","_type":"internationalizedArrayStringValue","value":"I find fulfillment in actively communicating with our customers around the world and delivering value to them. I'm grateful to contribute as a member of iMarketKorea, which is on a journey to become a world-class industrial materials distribution service company."}]},{"_key":"54dd7fc9b7fd","_type":"textType","id":"sales-popup2-text-array-4","value":[{"_key":"ko","_type":"internationalizedArrayStringValue","value":"첫째는 의사소통 능력입니다. 글로벌 고객과의 소통에서 원활한 관계를 형성하고 문제 해결 능력이 많이 필요합니다. 또한, 해외 고객과의 소통할 일이 많기에 외국어 역량도 필요할 것입니다. 담당하는 지역마다 필요한 언어 역량을 다를 수 있지만 영어/중국어가 주요 필요 언어입니다. 두 번째는 문제 해결 능력입니다. 무역 거래에서 다양한 이슈가 발생하므로, 리스크의 선제적 관리를 위한 꼼꼼함과 사전 지식 준비도 필요할 것 같습니다."},{"_key":"en","_type":"internationalizedArrayStringValue","value":"First is communication ability. Building smooth relationships with global customers requires strong problem-solving skills. Language proficiency is also essential, as we frequently need to communicate with overseas clients. While required languages may vary by region, English and Chinese are the primary languages needed. The second is problem-solving ability. Since various issues can arise in trade transactions, attention to detail and early knowledge are necessary for proactive risk management."}]},{"_key":"b39c64c8f2e1","_type":"textType","id":"sales-popup2-text-array-5","value":[{"_key":"ko","_type":"internationalizedArrayStringValue","value":"취업이 어려운 시기에 어렵게 취업한 미래의 동료들이 좋은 회사에서 고생했다고 말하고 싶고, 그 정도의 열정과 노력으로 회사에 어떠한 일을 부여 받더라도 잘할 거라 믿어 의심치 않습니다."},{"_key":"en","_type":"internationalizedArrayStringValue","value":"To my future colleagues who've secured positions in these challenging times, I want to support your hard work at this great company. I'm confident that with passion and effort, you'll excel at any task you are assigned."}]}]},{"_key":"7d9a5f3f9b6c","_type":"imgType","id":"sales-desktop-img","image":{"_type":"image","alt":[{"_key":"ko","_type":"internationalizedArrayStringValue","value":"중부영업팀 - 김준우"},{"_key":"en","_type":"internationalizedArrayStringValue","value":"Central Sales Team – Kim Jun-woo"}],"asset":{"_ref":"/image/careers/jobdescriptions/section-careers-jobdescriptions-sales-37.webp","_type":"reference"}}},{"_key":"50b34c9eaa852185b4a81e75f60dc69d","_type":"imgType","id":"sales-mobile-img","image":{"_type":"image","alt":[{"_key":"ko","_type":"internationalizedArrayStringValue","value":"중부영업팀 - 김준우"},{"_key":"en","_type":"internationalizedArrayStringValue","value":"Central Sales Team – Kim Jun-woo"}],"asset":{"_ref":"/image/careers/jobdescriptions/section-careers-jobdescriptions-sales-38.webp","_type":"reference"}}},{"_key":"b573bf211ce41c6188df75231ed14d1d","_type":"imgType","id":"sales-desktop2-img","image":{"_type":"image","alt":[{"_key":"ko","_type":"internationalizedArrayStringValue","value":"해외사업팀 - 오영진"},{"_key":"en","_type":"internationalizedArrayStringValue","value":"Overseas Business Team – Oh Young-jin"}],"asset":{"_ref":"/image/careers/jobdescriptions/section-careers-jobdescriptions-sales-39.webp","_type":"reference"}}},{"_key":"1455bc863055d8a19e943f19d5b5e651","_type":"imgType","id":"sales-mobile2-img","image":{"_type":"image","alt":[{"_key":"ko","_type":"internationalizedArrayStringValue","value":"해외사업팀 - 오영진"},{"_key":"en","_type":"internationalizedArrayStringValue","value":"Overseas Business Team – Oh Young-jin"}],"asset":{"_ref":"/image/careers/jobdescriptions/section-careers-jobdescriptions-sales-40.webp","_type":"reference"}}}],"description":"sales-title-text :sales 타이틀 텍스트\nsales-sub-text : sales 서브 타이틀 텍스트\nsales-description-text : sales 내용 텍스트\nsales-quote-text : sales 인용구 텍스트\nsales-job-text : sales 직무 텍스트\nsales-button-link : sales 버튼 링크\nsales-profile-img :  sales 프로필 이미지 \nsales-title-text-array:  sales 팝업 제목 타이틀 텍스트 리스트\nsales-popup-text-array:  sales 팝업 내용 타이틀 텍스트 리스트\nsales-desktop-array:  sales 팝업 데스크톱 이미지\nsales-mobile-array:  sales 팝업 모바일 이미지"}],"keyword":[{"_key":"ko","_type":"internationalizedArrayStringValue","value":"아이마켓코리아 직무소개"},{"_key":"en","_type":"internationalizedArrayStringValue","value":"아이마켓코리아 직무소개"}],"isNav":true,"image":{"_type":"image","asset":{"_ref":"https://www.imarketkorea.com/image/careers/jobdescriptions/imarket-20.png","_type":"reference"}},"description":[{"_key":"ko","_type":"internationalizedArrayStringValue","value":"창의적이고 열정적인 인재들이 모여 다양한 재능을 하나로 모아 혁신을 주도하고 미래를 만들어갑니다."},{"_key":"en","_type":"internationalizedArrayStringValue","value":"Creative and passionate talents come together to drive innovation and create a better future by combining their diverse abilities"}],"_updatedAt":"2024-12-10T06:46:47Z","_type":"page","_rev":"CsJhS699U5wscrFy7Si81y","_originalId":"1222cbf5-85ba-448c-a01a-95a65491d222","_id":"1222cbf5-85ba-448c-a01a-95a65491d222","_createdAt":"2024-08-14T07:23:35Z"}
