<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>김지호 입사지원 포트폴리오</title>
<meta name="description" content="김지호 포트폴리오 · AI 에이전트, 업무용 발표자료, 웹 앱 작업물 모음">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --blue:#3F82EC; --blue-d:#1F56C8; --blue-dd:#163E96; --blue-l:#DCE9FD; --blue-ll:#EEF4FE;
  --ink:#18202F; --ink2:#4A5568; --ink3:#8792A6; --line:#DDE5F2; --bg:#E6EBF4; --card:#fff;
  --mint:#12B5A0; --amber:#F5A524; --red:#E5484D;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);overflow:hidden}
body{font-family:"Pretendard Variable",Pretendard,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;word-break:keep-all}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}

/* ---------- stage ---------- */
#viewport{position:fixed;inset:0;display:grid;place-items:center}
#stage{width:1920px;height:1080px;position:absolute;left:50%;top:50%;transform-origin:0 0;background:#fff;border-radius:28px;overflow:hidden;box-shadow:0 40px 120px rgba(31,60,120,.18)}
.slide{position:absolute;inset:0;padding:110px 110px 96px;opacity:0;visibility:hidden;transform:translateX(60px);transition:opacity .5s var(--ease),transform .7s var(--ease),visibility 0s .7s;background:#F4F7FC}
.slide.active{opacity:1;visibility:visible;transform:none;transition:opacity .5s var(--ease),transform .7s var(--ease);z-index:2}
.slide.prev{transform:translateX(-60px)}
.slide:not(.cover):not(.toc):not(.end){display:flex;flex-direction:column}
.body{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;padding-bottom:20px}

/* staggered entrance */
[data-a]{opacity:0}
.slide.active [data-a]{animation:up .8s var(--ease) both;animation-delay:calc(var(--i,0)*70ms + 150ms)}
.slide.active [data-a="pop"]{animation-name:pop}
.slide.active [data-a="left"]{animation-name:fromL}
.slide.active [data-a="right"]{animation-name:fromR}
.slide.active [data-a="fade"]{animation-name:fade}
@keyframes up{from{opacity:0;transform:translateY(34px);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
@keyframes pop{from{opacity:0;transform:scale(.86)}to{opacity:1;transform:none}}
@keyframes fromL{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:none}}
@keyframes fromR{from{opacity:0;transform:translateX(80px) rotate(1.5deg)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}

/* ---------- common header ---------- */
.hd{display:flex;align-items:center;gap:22px;margin-bottom:24px;flex:none}
.no{width:64px;height:64px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:800;font-size:24px;flex:none;box-shadow:0 8px 20px rgba(63,130,236,.35)}
.hd small{display:block;font-size:19px;font-weight:700;color:var(--blue-d);letter-spacing:.02em;margin-bottom:6px}
.hd h2{font-size:42px;font-weight:800;letter-spacing:-.02em;line-height:1.25}
.back{margin-left:auto;height:52px;padding:0 24px;border-radius:999px;background:#fff;color:var(--blue-d);border:2px solid var(--blue-l);font-size:19px;font-weight:700;transition:transform .25s var(--ease),background .25s,color .25s}
.back:hover{background:var(--blue);color:#fff;border-color:var(--blue);transform:translateY(-3px)}
.brand{position:absolute;right:110px;top:54px;font-size:16px;font-weight:700;letter-spacing:.16em;color:var(--ink3)}
.pg{position:absolute;right:110px;bottom:44px;font-size:17px;font-weight:600;color:var(--ink3);font-variant-numeric:tabular-nums}
.note{position:absolute;left:110px;bottom:44px;font-size:16px;color:var(--ink3)}
.card{background:var(--card);border-radius:24px;box-shadow:0 10px 30px rgba(31,60,120,.07);border:1px solid #E8EEF8}
.chip{display:inline-flex;align-items:center;height:40px;padding:0 18px;border-radius:999px;background:var(--blue-ll);color:var(--blue-d);font-size:18px;font-weight:700;border:1px solid var(--blue-l)}
.chip.dark{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.red{background:#FDECEC;color:#C8343A;border-color:#F9D5D6}
.btn{display:inline-flex;align-items:center;gap:10px;height:54px;padding:0 26px;border-radius:999px;background:var(--blue);color:#fff;font-size:20px;font-weight:700;box-shadow:0 10px 24px rgba(63,130,236,.35);transition:transform .25s var(--ease),box-shadow .25s}
.btn:hover{transform:translateY(-3px);box-shadow:0 16px 30px rgba(63,130,236,.45)}
.btn.ghost{background:#fff;color:var(--blue-d);border:2px solid var(--blue-l);box-shadow:none}
.btn svg{width:18px;height:18px}

/* ---------- cover ---------- */
.cover{padding:0;background:#fff}
.cover .band{position:absolute;left:0;top:0;right:0;height:400px;background:var(--blue)}
.cover svg.wave{position:absolute;inset:0;width:100%;height:100%}
.cover .logo{position:absolute;left:110px;top:70px;color:#fff;font-size:30px;font-weight:800;letter-spacing:.02em;display:flex;gap:14px;align-items:center}
.cover .logo i{width:44px;height:44px;border-radius:12px;background:#fff;color:var(--blue);display:grid;place-items:center;font-style:normal;font-size:22px}
.cover .txt{position:absolute;left:110px;top:500px;width:1000px}
.cover .kicker{font-size:38px;font-weight:700;color:var(--blue)}
.cover h1{font-size:108px;line-height:1.2;font-weight:500;letter-spacing:-.03em;margin:20px 0 40px}
.cover h1 b{font-weight:800}
.cover p{font-size:34px;font-weight:600;color:var(--ink)}
.cover .date{position:absolute;right:110px;bottom:70px;font-size:30px;font-weight:600}
.wave path{fill:none;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1}
.slide.active .wave path{animation:draw 2.6s cubic-bezier(.6,0,.2,1) .2s both}

/* ---------- contents ---------- */
.toc{padding:0;display:grid;grid-template-columns:760px 1fr;background:#fff}
.toc .l{background:var(--blue);position:relative;overflow:hidden;padding:150px 110px;color:#fff}
.toc .l h2{font-size:92px;font-weight:800;letter-spacing:-.02em}
.toc .l p{font-size:25px;line-height:1.7;margin-top:40px;opacity:.92;max-width:500px}
.toc .l svg{position:absolute;inset:0;width:100%;height:100%}
.toc .r{padding:150px 130px 0 120px}
.toc li{list-style:none;display:flex;align-items:center;gap:30px;padding:28px 6px;border-bottom:2px solid var(--line);font-size:34px;font-weight:700;cursor:pointer;transition:padding .3s var(--ease),color .3s}
.toc li:hover{padding-left:24px;color:var(--blue-d)}
.toc li span{font-size:22px;font-weight:800;color:var(--blue);width:52px}
.toc li em{margin-left:auto;font-style:normal;font-size:21px;font-weight:500;color:var(--ink3)}

/* ---------- stats ---------- */
.lead{font-size:30px;line-height:1.6;font-weight:500;color:var(--ink2);max-width:1500px;margin-bottom:50px}
.lead b{color:var(--ink);font-weight:800}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:28px}
.stat{padding:54px 40px 54px;position:relative;overflow:hidden}
.stat::after{content:"";position:absolute;left:0;right:0;bottom:0;height:8px;background:var(--blue);transform-origin:left;transform:scaleX(0)}
.slide.active .stat::after{animation:grow 1.2s var(--ease) .7s both}
.stat .n{font-size:104px;font-weight:800;letter-spacing:-.04em;color:var(--blue-d);line-height:1;font-variant-numeric:tabular-nums}
.stat .n u{font-size:40px;text-decoration:none;margin-left:6px;font-weight:700}
.stat h3{font-size:27px;font-weight:800;margin:26px 0 10px}
.stat p{font-size:22px;line-height:1.55;color:var(--ink2)}
.tags{display:flex;gap:14px;flex-wrap:wrap;margin-top:44px;align-items:center}
.tags strong{font-size:20px;color:var(--ink3);margin-right:8px}

/* ---------- timeline ---------- */
.tl{display:grid;grid-template-columns:1fr 1.5fr 1fr;gap:28px;position:relative;margin-top:70px}
.tl::before{content:"";position:absolute;left:0;right:0;top:-36px;height:4px;background:var(--blue-l);border-radius:4px}
.tl::after{content:"";position:absolute;left:0;right:0;top:-36px;height:4px;background:var(--blue);border-radius:4px;transform-origin:left;transform:scaleX(0)}
.slide.active .tl::after{animation:grow 1.8s var(--ease) .4s both}
.tl .card{padding:44px 40px 44px;position:relative}
.tl .card::before{content:"";position:absolute;left:38px;top:-48px;width:28px;height:28px;border-radius:50%;background:#fff;border:7px solid var(--blue);z-index:2}
.tl .yr{font-size:22px;font-weight:800;color:var(--blue-d)}
.tl h3{font-size:34px;font-weight:800;margin:10px 0 6px}
.tl h4{font-size:21px;font-weight:600;color:var(--ink3);margin-bottom:22px}
.tl li{list-style:none;position:relative;padding-left:22px;font-size:23px;line-height:1.6;color:var(--ink2);margin-bottom:14px}
.tl li::before{content:"";position:absolute;left:0;top:15px;width:8px;height:8px;border-radius:50%;background:var(--blue)}
.tl li b{color:var(--ink)}
.tl .now{background:var(--blue);color:#fff;border-color:var(--blue)}
.tl .now .yr,.tl .now h4{color:#DCE9FD}.tl .now li{color:#EEF4FE}.tl .now li::before{background:#fff}

/* ---------- skills ---------- */
.sk{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
.sk .card{padding:44px 40px}
.sk h3{font-size:27px;font-weight:800;margin-bottom:8px;display:flex;align-items:center;gap:14px}
.sk h3 i{width:46px;height:46px;border-radius:14px;background:var(--blue-ll);display:grid;place-items:center;color:var(--blue-d)}
.sk h3 i svg{width:24px;height:24px}
.sk p{font-size:19px;color:var(--ink3);margin-bottom:24px}
.sk .chips{display:flex;flex-wrap:wrap;gap:10px}
.edu{display:grid;grid-template-columns:1.6fr 1fr;gap:28px;margin-top:28px}
.edu .card{padding:34px 38px}
.edu h3{font-size:22px;font-weight:800;color:var(--blue-d);margin-bottom:18px}
.edu table{width:100%;border-collapse:collapse;font-size:21px}
.edu td{padding:11px 0;border-top:1px solid var(--line)}
.edu tr:first-child td{border-top:0}
.edu td:first-child{color:var(--ink3);width:250px;font-variant-numeric:tabular-nums}
.edu td b{font-weight:800}

/* ---------- project map ---------- */
.map{display:grid;grid-template-columns:repeat(4,1fr);gap:22px}
.mc{padding:0;overflow:hidden;cursor:pointer;transition:transform .35s var(--ease),box-shadow .35s;display:flex;flex-direction:column;height:232px}
.mc:hover{transform:translateY(-8px);box-shadow:0 22px 40px rgba(31,60,120,.16)}
.mc .th{height:128px;background:var(--blue-ll) center top/cover no-repeat;border-bottom:1px solid var(--line);position:relative}
.mc .th span{position:absolute;left:14px;top:14px;height:30px;padding:0 12px;border-radius:999px;background:var(--blue);color:#fff;font-size:15px;font-weight:800;display:grid;place-items:center}
.mc h3{font-size:22px;font-weight:800;padding:16px 20px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc p{font-size:16.5px;color:var(--ink3);padding:0 20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc.sum{background:var(--blue);color:#fff;border-color:var(--blue);padding:30px;justify-content:center;cursor:default}
.mc.sum:hover{transform:none}
.mc.sum b{font-size:60px;font-weight:800;line-height:1}
.mc.sum span{font-size:19px;line-height:1.5;margin-top:12px;opacity:.95}

/* ---------- project slide ---------- */
.pj{display:grid;grid-template-columns:730px 1fr;gap:70px;height:740px}
.pj .sub{font-size:28px;line-height:1.5;font-weight:600;color:var(--ink2);margin-bottom:30px}
.pt{display:flex;gap:20px;padding:22px 26px;margin-bottom:14px;align-items:flex-start}
.pt i{flex:none;width:44px;height:44px;border-radius:13px;background:var(--blue);color:#fff;font-style:normal;font-weight:800;font-size:19px;display:grid;place-items:center}
.pt h4{font-size:23px;font-weight:800;margin-bottom:5px}
.pt p{font-size:19.5px;line-height:1.55;color:var(--ink2)}
.pj .chips{display:flex;flex-wrap:wrap;gap:10px;margin:24px 0 26px}
.pj .links{display:flex;gap:14px}
.vis{position:relative}
.frame{position:absolute;background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 30px 70px rgba(31,60,120,.22);border:1px solid #D9E2F1}
.frame .bar{height:42px;background:#EEF2F9;display:flex;align-items:center;gap:8px;padding:0 16px;border-bottom:1px solid #DDE5F2}
.frame .bar b{width:12px;height:12px;border-radius:50%;background:#F26B64}
.frame .bar b:nth-child(2){background:#F5BD4F}.frame .bar b:nth-child(3){background:#5CC55B}
.frame .bar span{margin-left:14px;font-size:14px;color:var(--ink3);background:#fff;border-radius:8px;padding:4px 14px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.frame img{display:block;width:100%;height:calc(100% - 42px);object-fit:cover;object-position:top}
.frame.plain{height:auto!important}.frame.plain img{height:auto}
.frame.f1{left:0;top:10px;width:900px;height:605px}
.frame.f2{right:0;bottom:0;width:560px;height:392px}
.frame.solo{left:0;top:40px;width:980px;height:655px}
.frame.solo.plain{top:90px}
.slide.active .frame.f2{animation:fromR .9s var(--ease) .75s both,float 6s ease-in-out 1.8s infinite}
.phone{position:absolute;left:50%;top:-20px;margin-left:-190px;width:380px;height:790px;border-radius:54px;background:#111827;padding:14px;box-shadow:0 40px 80px rgba(31,60,120,.3)}
.phone img{width:100%;height:100%;object-fit:cover;object-position:top;border-radius:42px;display:block}
.blob{position:absolute;right:-60px;top:-30px;width:560px;height:560px;border-radius:50%;background:radial-gradient(circle,var(--blue-l),transparent 70%);z-index:-1}

/* ---------- principles ---------- */
.pr{display:grid;grid-template-columns:repeat(2,1fr);gap:28px}
.pr .card{padding:56px 48px;display:grid;grid-template-columns:96px 1fr;gap:10px 30px}
.pr .big{font-size:76px;font-weight:800;color:var(--blue-l);line-height:1;grid-row:span 2;-webkit-text-stroke:2px var(--blue)}
.pr h3{font-size:33px;font-weight:800}
.pr p{font-size:23px;line-height:1.6;color:var(--ink2)}
.pr p b{color:var(--blue-d)}

/* ---------- closing ---------- */
.end{padding:0;background:var(--blue);color:#fff}
.end svg{position:absolute;inset:0;width:100%;height:100%}
.end .in{position:absolute;left:110px;top:150px;width:1100px}
.end h2{font-size:112px;font-weight:800;letter-spacing:-.03em;line-height:1.15}
.end p{font-size:31px;line-height:1.6;margin:36px 0 60px;opacity:.95}
.ct{display:grid;grid-template-columns:repeat(3,auto);gap:18px;justify-content:start}
.ct a,.ct div{background:#fff;color:var(--ink);border-radius:22px;padding:26px 34px;min-width:300px;transition:transform .3s var(--ease)}
.ct a:hover{transform:translateY(-6px)}
.ct small{display:block;font-size:17px;font-weight:800;color:var(--blue-d);letter-spacing:.08em;margin-bottom:8px}
.ct b{font-size:25px;font-weight:800}
.end .fine{position:absolute;left:110px;bottom:60px;font-size:17px;opacity:.8;max-width:1300px;line-height:1.6}

/* ---------- chrome ---------- */
#bar{position:fixed;left:0;top:0;height:5px;background:var(--blue);width:0;transition:width .6s var(--ease);z-index:20}
#nav{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;align-items:center;gap:6px;background:rgba(24,32,47,.86);color:#fff;border-radius:999px;padding:6px 8px;z-index:20;backdrop-filter:blur(10px);opacity:.25;transition:opacity .3s}
#nav:hover,#nav.show{opacity:1}
#nav button{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:17px}
#nav button:hover{background:rgba(255,255,255,.16)}
#nav span{font-size:14px;font-weight:600;min-width:64px;text-align:center;font-variant-numeric:tabular-nums}
#ov{position:fixed;inset:0;background:rgba(15,22,38,.94);z-index:30;display:none;overflow:auto;padding:60px}
#ov.on{display:block}
#ov .g{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px;max-width:1500px;margin:0 auto}
#ov button{aspect-ratio:16/9;border-radius:12px;background:#fff;color:var(--ink);text-align:left;padding:18px;font-size:16px;font-weight:700;line-height:1.4;display:flex;flex-direction:column;justify-content:space-between;border:3px solid transparent;transition:transform .2s}
#ov button:hover{transform:scale(1.04)}
#ov button.cur{border-color:var(--blue)}
#ov button i{font-style:normal;color:var(--blue);font-size:13px;font-weight:800}

@media (prefers-reduced-motion:reduce){
  .slide,.slide.active{transition:opacity .2s;transform:none}
  .slide.active [data-a],.slide.active .frame.f2{animation:fade .2s both}
  .slide.active .wave path{animation:none;stroke-dashoffset:0}
}
@media print{
  @page{size:1920px 1080px;margin:0}
  html,body{overflow:visible;height:auto;background:#fff}
  #viewport{position:static;display:block}
  #stage{position:static;transform:none!important;width:auto;height:auto;border-radius:0;box-shadow:none;overflow:visible}
  .slide{position:relative;width:1920px;height:1080px;opacity:1;visibility:visible;transform:none;page-break-after:always;overflow:hidden}
  [data-a]{opacity:1!important;animation:none!important}
  .wave path{stroke-dashoffset:0!important;animation:none!important}
  .stat::after,.tl::after{transform:none!important;animation:none!important}
  #nav,#bar,#ov{display:none!important}
}
</style>
</head>
<body>
<div id="bar"></div>
<div id="viewport"><div id="stage"></div></div>
<div id="nav">
  <button id="bp" aria-label="이전">←</button><span id="cnt"></span><button id="bn" aria-label="다음">→</button>
  <button id="bo" aria-label="전체 보기" title="전체 보기 (O)">▦</button><button id="bf" aria-label="전체화면" title="전체화면 (F)">⛶</button>
</div>
<div id="ov"><div class="g"></div></div>

<script>
const PAGES = 'https://jihosw.github.io/jiho-agent/';
const REPO = 'https://github.com/JIHOSW/jiho-agent/tree/main/';
const gh = p => REPO + encodeURI(p);
const ARROW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M8 7h9v9"/></svg>';

/* ---- 프로젝트 데이터 ---- */
const projects = [
 {cat:'AI 에이전트', title:'기술지원 티켓 에이전트', short:'문의 분류 → KB 검색 → 답변 초안 → 승인',
  sub:'고객 문의를 분류하고 근거를 찾아 답변 초안을 쓰는 기술지원 1차 대응 에이전트',
  pts:[['분류와 SLA','문의를 유형 7가지와 긴급도 P1~P4로 나누고 첫 응답 기한을 계산합니다.'],
       ['근거가 있을 때만 답변','KB 문서 일치도 50% 이상, 일치 표현 2개 이상일 때만 답변 근거로 씁니다. 없으면 개발 이슈로 2차 전달합니다.'],
       ['해결 내용의 환류','해결된 티켓은 새 KB 문서가 되어, 같은 문의는 다음부터 1차에서 해결됩니다.']],
  chips:['단일 HTML','규칙 기반','사람 승인 후 발송','브라우저 저장'],
  links:[['시연 보기',PAGES+'support-agent/'],['코드',gh('기술지원 티켓 에이전트')]],
  vis:{type:'solo',img:'support',url:'jihosw.github.io/jiho-agent/support-agent'}},

let wid = 0;
function wave(d, color='#1F56C8', n=5, gap=13){
  const id='w'+(++wid); let m='';
  for(let k=n;k>0;k--){
    m+=`<path d="${d}" pathLength="1" stroke="#fff" stroke-width="${k*gap*2-gap+5}"/>`;
    m+=`<path d="${d}" pathLength="1" stroke="#000" stroke-width="${k*gap*2-gap-5}"/>`;
  }
  return `<svg class="wave" viewBox="0 0 1920 1080" preserveAspectRatio="none" aria-hidden="true"><defs><mask id="${id}" maskUnits="userSpaceOnUse" x="0" y="0" width="1920" height="1080">${m}</mask></defs><rect width="1920" height="1080" fill="${color}" mask="url(#${id})"/></svg>`;
}

/* ---- render ---- */
const stage = document.getElementById('stage');
const pad = n => String(n).padStart(2,'0');
stage.innerHTML = S.map((s,i)=>`<section class="slide ${s.cls||''}" data-i="${i}">${
  s.cls ? s.html : `<div class="brand">KIM JIHO · PORTFOLIO</div>
  <div class="hd" data-a><div class="no">${s.sec}</div><div><small>${s.label}</small><h2>${s.h}</h2></div>${s.back?`<button class="back" data-go="6" title="작업물 11개를 한눈에">▦ 전체 작업물로</button>`:''}</div>
  <div class="body">${s.html}</div>${s.note?`<div class="note">${s.note}</div>`:''}<div class="pg">${pad(i+1)} / ${pad(S.length)}</div>`
}</section>`).join('');
const slides = [...stage.children];
slides.forEach(s => s.querySelectorAll('[data-a]').forEach((el,k)=>el.style.setProperty('--i',k)));

/* ---- navigation ---- */
let cur = -1;
const bar = document.getElementById('bar'), cnt = document.getElementById('cnt'), ov = document.getElementById('ov');
function countUp(sl){
  sl.querySelectorAll('[data-count]').forEach(el=>{
    const to=+el.dataset.count, t0=performance.now(), dur=1300;
    if(matchMedia('(prefers-reduced-motion:reduce)').matches){el.textContent=to;return}
    (function tick(t){const p=Math.min(1,(t-t0)/dur);el.textContent=Math.round(to*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(tick)})(t0);
  });
}
function go(n){
  n = Math.max(0, Math.min(S.length-1, n));
  if(n===cur) return;
  slides.forEach((s,i)=>{ s.classList.toggle('active', i===n); s.classList.toggle('prev', i<n); });
  cur = n; countUp(slides[n]);
  bar.style.width = ((n+1)/S.length*100)+'%';
  cnt.textContent = `${n+1} / ${S.length}`;
  history.replaceState(null,'','#'+(n+1));
  document.title = `김지호 입사지원 포트폴리오 · ${S[n].title}`;
}
function fit(){
  const k = Math.min(innerWidth/1920, innerHeight/1080) * (innerWidth<900 ? 1 : .96);
  stage.style.transform = `scale(${k}) translate(-50%,-50%)`;
}
function overview(on){
  ov.classList.toggle('on', on ?? !ov.classList.contains('on'));
  ov.querySelectorAll('button').forEach((b,i)=>b.classList.toggle('cur', i===cur));
}
ov.querySelector('.g').innerHTML = S.map((s,i)=>`<button data-go="${i+1}"><i>${pad(i+1)}</i>${s.title}</button>`).join('');
document.addEventListener('click', e=>{
  const g = e.target.closest('[data-go]');
  if(g){ go(+g.dataset.go-1); overview(false); return; }
  if(e.target===ov) overview(false);
});
document.getElementById('bp').onclick = ()=>go(cur-1);
document.getElementById('bn').onclick = ()=>go(cur+1);
document.getElementById('bo').onclick = ()=>overview();
const fs = ()=> document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.();
document.getElementById('bf').onclick = fs;
addEventListener('keydown', e=>{
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  const k=e.key;
  if(['ArrowRight','PageDown',' ','Enter'].includes(k)){e.preventDefault();go(cur+1)}
  else if(['ArrowLeft','PageUp','Backspace'].includes(k)){e.preventDefault();go(cur-1)}
  else if(k==='Home')go(0); else if(k==='End')go(S.length-1);
  else if(k==='o'||k==='O')overview(); else if(k==='f'||k==='F')fs();
  else if(k==='Escape')overview(false);
});
let tx=null;
addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
addEventListener('touchend',e=>{if(tx===null)return;const d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>50)go(cur+(d<0?1:-1));tx=null},{passive:true});
addEventListener('resize', fit);
const nav=document.getElementById('nav');let nt;
addEventListener('mousemove',()=>{nav.classList.add('show');clearTimeout(nt);nt=setTimeout(()=>nav.classList.remove('show'),2000)});
fit(); go((parseInt(location.hash.slice(1))||1)-1);
</script>
