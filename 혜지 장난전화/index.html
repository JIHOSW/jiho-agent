<title>수상한 전화 한 통</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=Gaegu:wght@400;700&display=swap">
<style>
/* Layout: one phone-sized stage, four full-bleed screens that cross-fade in sequence
   (incoming call → voice 1 → voice 2 → call ended note). Single deliberate night look. */
:root {
  --night: #12141f;        /* page ground */
  --night-2: #1c1f30;      /* raised glass */
  --glow: #f2a07b;         /* warm lamp glow, the one accent */
  --ink: #f4efe9;          /* primary text */
  --ink-dim: #a6a3ae;      /* secondary text */
  --accept: #34c46a;
  --decline: #ec4b4b;
  --paper: #fbf4ea;        /* final note card */
  --paper-ink: #3a2a22;

  --font-ui: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
  --font-hand: "Gaegu", "Nanum Pen Script", "Apple SD Gothic Neo", cursive;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--night);
  color: var(--ink);
  font-family: var(--font-ui);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}
.stage {
  position: relative;
  height: 100%;
  max-width: 440px;
  margin: 0 auto;
  overflow: hidden;
  isolation: isolate;
}
/* ambient glow, like a lamp left on */
.stage::before {
  content: "";
  position: absolute; inset: -20%;
  background:
    radial-gradient(40% 30% at 30% 18%, rgba(242,160,123,.28), transparent 70%),
    radial-gradient(50% 40% at 80% 90%, rgba(242,160,123,.12), transparent 70%);
  filter: blur(10px);
  z-index: -1;
  animation: drift 14s ease-in-out infinite alternate;
}
@keyframes drift { to { transform: translate(4%, 3%) scale(1.05); } }

.screen {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center;
  padding-block: 56px 40px;
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
  opacity: 0; visibility: hidden;
  transform: scale(1.02);
  transition: opacity .5s ease, transform .5s ease, visibility 0s linear .5s;
}
.screen.on {
  opacity: 1; visibility: visible; transform: none;
  transition: opacity .5s ease, transform .5s ease, visibility 0s;
}

/* ---------- avatar ---------- */
.avatar {
  position: relative;
  width: 132px; height: 132px; border-radius: 50%;
  background: linear-gradient(160deg, #3a3550, #24263a);
  display: grid; place-items: center;
  box-shadow: 0 10px 40px rgba(0,0,0,.4);
}
.avatar svg { width: 62%; height: 62%; }
.avatar.small { width: 84px; height: 84px; }
.ring {
  position: absolute; inset: 0; border-radius: 50%;
  border: 2px solid var(--glow);
  opacity: 0;
  animation: ring 2.4s ease-out infinite;
}
.ring:nth-child(2) { animation-delay: .8s; }
.ring:nth-child(3) { animation-delay: 1.6s; }
@keyframes ring {
  0% { transform: scale(1); opacity: .7; }
  100% { transform: scale(2.1); opacity: 0; }
}

/* ---------- screen 1: incoming ---------- */
#s-ring { justify-content: space-between; }
#s-ring .top { flex: 1; display: grid; place-items: center; }
.ring-dots { display: flex; gap: 8px; margin-top: 44px; justify-content: center; }
.ring-dots i {
  width: 7px; height: 7px; border-radius: 50%; background: var(--ink-dim);
  animation: dot 1.2s ease-in-out infinite;
}
.ring-dots i:nth-child(2) { animation-delay: .2s; }
.ring-dots i:nth-child(3) { animation-delay: .4s; }
@keyframes dot { 50% { background: var(--glow); transform: translateY(-4px); } }

.answer-row {
  width: 100%;
  display: flex; justify-content: space-around; align-items: center;
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.round {
  width: 76px; height: 76px; border-radius: 50%;
  border: 0; cursor: pointer;
  display: grid; place-items: center;
  color: #fff;
  transition: transform .35s cubic-bezier(.3,1.6,.5,1);
}
.round svg { width: 34px; height: 34px; }
.round:focus-visible, .chip:focus-visible, .ghost:focus-visible { outline: 3px solid var(--glow); outline-offset: 4px; }
.decline { background: var(--decline); }
.decline svg { transform: rotate(135deg); }
.accept { background: var(--accept); animation: nudge 1.4s ease-in-out infinite; }
@keyframes nudge {
  0%, 60%, 100% { transform: rotate(0); }
  10%, 30%, 50% { transform: rotate(-14deg); }
  20%, 40% { transform: rotate(14deg); }
}
.accept-wrap { position: relative; display: inline-block; transition: transform .35s cubic-bezier(.3,1.6,.5,1); }
.accept-wrap::after {
  content: ""; position: absolute; inset: -8px; border-radius: 50%;
  border: 2px solid var(--accept); opacity: .5;
  animation: ring 1.6s ease-out infinite;
  pointer-events: none;
}

/* ---------- call screens ---------- */
.caller { text-align: center; display: grid; justify-items: center; gap: 6px; }
.caller .avatar { margin-bottom: 10px; }
.caller h1 { margin: 0; font-size: 1.55rem; font-weight: 600; letter-spacing: -.01em; text-wrap: balance; }
.caller .meta { font-size: .86rem; color: var(--ink-dim); font-variant-numeric: tabular-nums; }
.caller .tag {
  font-size: .72rem; letter-spacing: .06em; color: var(--glow);
  border: 1px solid rgba(242,160,123,.45); border-radius: 99px;
  padding: 2px 10px; margin-top: 2px;
}

.voice {
  margin-top: 30px;
  width: 100%;
  background: rgba(28,31,48,.78);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,.06);
  border-radius: 22px;
  padding: 18px 18px 20px;
  display: grid; gap: 14px;
}
.player { display: flex; align-items: center; gap: 14px; }
.play {
  flex: none;
  width: 44px; height: 44px; border-radius: 50%;
  border: 0; cursor: pointer;
  background: var(--glow); color: var(--night);
  display: grid; place-items: center;
}
.play svg { width: 18px; height: 18px; }
.wave { flex: 1; min-width: 0; height: 34px; display: flex; align-items: center; gap: 3px; }
.wave span {
  flex: 1; max-width: 4px; border-radius: 2px;
  background: var(--ink-dim); opacity: .45;
  height: var(--h, 30%);
  transition: opacity .2s;
}
.voice.playing .wave span {
  background: var(--glow); opacity: 1;
  animation: bar .9s ease-in-out infinite alternate;
  animation-delay: var(--d, 0s);
}
@keyframes bar { from { transform: scaleY(.35); } to { transform: scaleY(1); } }
.dur { flex: none; font-size: .8rem; color: var(--ink-dim); font-variant-numeric: tabular-nums; min-width: 2.6em; text-align: right; }
.sub {
  margin: 0;
  font-size: 1.02rem; line-height: 1.65;
  min-height: 3.3em;
  word-break: keep-all;
}
.sub .w { opacity: 0; transition: opacity .35s ease; }
.sub .w.v { opacity: 1; }

.replies {
  margin-top: auto;
  width: 100%;
  display: grid; gap: 10px;
  padding-bottom: env(safe-area-inset-bottom, 0px);
  opacity: 0; transform: translateY(14px);
  pointer-events: none;
  transition: opacity .45s ease, transform .45s ease;
}
.replies.show { opacity: 1; transform: none; pointer-events: auto; }
.replies .label {
  font-size: .74rem; letter-spacing: .08em; color: var(--ink-dim);
  text-align: right; padding-right: 4px;
}
.chip {
  justify-self: end;
  max-width: 88%;
  border: 0; cursor: pointer;
  background: var(--accept); color: #fff;
  font: 500 1rem/1.4 var(--font-ui);
  padding: 12px 18px;
  border-radius: 20px 20px 6px 20px;
  text-align: left;
  word-break: keep-all;
  transition: transform .15s ease, filter .15s ease;
}
.chip.alt { background: var(--night-2); color: var(--ink); border: 1px solid rgba(255,255,255,.1); }
.chip:hover { filter: brightness(1.08); }
.chip:active { transform: scale(.96); }
.chip.sent { animation: sent .4s ease forwards; }
@keyframes sent { to { transform: translateY(-30px) scale(.9); opacity: 0; } }

/* ---------- final ---------- */
#s-end { justify-content: center; gap: 22px; }
.ended { font-size: .86rem; color: var(--ink-dim); text-align: center; font-variant-numeric: tabular-nums; display: grid; gap: 4px; }
.ended b { color: var(--ink); font-weight: 500; font-size: 1rem; }
.note {
  width: 100%;
  background: var(--paper); color: var(--paper-ink);
  border-radius: 6px;
  padding: 28px 24px 24px;
  box-shadow: 0 24px 50px rgba(0,0,0,.45);
  transform: rotate(-1.4deg) translateY(20px);
  opacity: 0;
  transition: transform .8s cubic-bezier(.2,1.2,.4,1) .35s, opacity .6s ease .35s;
  position: relative;
}
#s-end.on .note { transform: rotate(-1.4deg); opacity: 1; }
.note::before { /* masking tape */
  content: ""; position: absolute; top: -12px; left: 50%;
  width: 92px; height: 24px; margin-left: -46px;
  background: rgba(242,160,123,.55);
  transform: rotate(2deg);
}
.note p {
  margin: 0;
  font-family: var(--font-hand);
  font-size: 1.6rem; line-height: 1.45;
  word-break: keep-all;
}
.note .from { margin-top: 16px; font-size: 1.2rem; text-align: right; opacity: .75; }
.note .play { background: var(--paper-ink); color: var(--paper); width: 38px; height: 38px; }
.note .player { margin-top: 18px; }
.note .wave span { background: var(--paper-ink); }
.note .voice-final.playing .wave span { background: var(--glow); opacity: 1; animation: bar .9s ease-in-out infinite alternate; animation-delay: var(--d, 0s); }
.note .dur { color: rgba(58,42,34,.6); }
.ghost {
  border: 1px solid rgba(255,255,255,.18); background: transparent; color: var(--ink-dim);
  font: 500 .9rem var(--font-ui);
  padding: 10px 18px; border-radius: 99px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 8px;
}
.ghost svg { width: 16px; height: 16px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; }
  .sub .w { opacity: 1; }
}
</style>

<div class="stage">

  <!-- 1. incoming call: no words, just the ringing -->
  <section class="screen on" id="s-ring" aria-label="전화가 오는 중">
    <div class="top">
      <div>
        <div class="avatar" aria-hidden="true">
          <span class="ring"></span><span class="ring"></span><span class="ring"></span>
          <svg viewBox="0 0 24 24" fill="#c9c3d6"><circle cx="12" cy="8.2" r="4.2"/><path d="M3.6 21c.6-4.6 4-7.4 8.4-7.4s7.8 2.8 8.4 7.4z"/></svg>
        </div>
        <div class="ring-dots" aria-hidden="true"><i></i><i></i><i></i></div>
      </div>
    </div>
    <div class="answer-row">
      <button class="round decline" id="btn-decline" aria-label="거절">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6.6 10.8a15.2 15.2 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1z"/></svg>
      </button>
      <span class="accept-wrap">
        <button class="round accept" id="btn-accept" aria-label="받기">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6.6 10.8a15.2 15.2 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1z"/></svg>
        </button>
      </span>
    </div>
  </section>

  <!-- 2. voice 1: greeting -->
  <section class="screen call" id="s-v1" data-voice="0">
    <div class="caller">
      <div class="avatar small" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="#c9c3d6"><circle cx="12" cy="8.2" r="4.2"/><path d="M3.6 21c.6-4.6 4-7.4 8.4-7.4s7.8 2.8 8.4 7.4z"/></svg>
      </div>
      <h1>대전 사는 오혜지</h1>
      <div class="meta"><span class="timer">00:00</span> · 발신지 김포시</div>
      <div class="tag">사칭 의심 번호</div>
    </div>
    <div class="voice">
      <div class="player">
        <button class="play" aria-label="음성 다시 듣기"></button>
        <div class="wave" aria-hidden="true"></div>
        <span class="dur">0:00</span>
      </div>
      <p class="sub">여보세요~? 김포 사는 김지호 씨입니까? 저는 대전 사는 오혜지인데요.</p>
    </div>
    <div class="replies">
      <div class="label">답장하기</div>
      <button class="chip">네, 제가 김포 사는 김지호입니다만?</button>
      <button class="chip alt">누구세요 ㅋㅋ 오혜지는 전데요</button>
    </div>
  </section>

  <!-- 3. voice 2: why I called -->
  <section class="screen call" id="s-v2" data-voice="1">
    <div class="caller">
      <div class="avatar small" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="#c9c3d6"><circle cx="12" cy="8.2" r="4.2"/><path d="M3.6 21c.6-4.6 4-7.4 8.4-7.4s7.8 2.8 8.4 7.4z"/></svg>
      </div>
      <h1>대전 사는 오혜지</h1>
      <div class="meta"><span class="timer">00:00</span> · 발신지 김포시</div>
      <div class="tag">사칭 의심 번호</div>
    </div>
    <div class="voice">
      <div class="player">
        <button class="play" aria-label="음성 다시 듣기"></button>
        <div class="wave" aria-hidden="true"></div>
        <span class="dur">0:00</span>
      </div>
      <p class="sub">오늘 우리 애기가 늦게까지 고생했다는 소식을 듣고 놀라서 전화 걸었습니다!! 얼른 마무리하고 지호랑 감사일기도 쓰고 행복하게 쉬어요!!</p>
    </div>
    <div class="replies">
      <div class="label">답장하기</div>
      <button class="chip">넵 꼭 전해드리겠습니다 🫡</button>
      <button class="chip alt">그 아기 지금 바로 쉬러 갑니다</button>
    </div>
  </section>

  <!-- 4. call ended: the real message -->
  <section class="screen" id="s-end">
    <div class="ended">
      <b>통화 종료</b>
      <span id="total">00:00</span>
    </div>
    <div class="note">
      <p>ㅋㅋ 아기, 오늘 진짜 고생했어.<br>웃는 목소리 듣고 싶어서 만들었어.<br>이제 푹 쉬어 🤍</p>
      <div class="player voice-final" id="final-player" hidden>
        <button class="play" aria-label="음성 듣기"></button>
        <div class="wave" aria-hidden="true"></div>
        <span class="dur">0:00</span>
      </div>
      <div class="from">— 김포 사는 김지호가</div>
    </div>
    <button class="ghost" id="btn-again">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
      다시 걸려오게 하기
    </button>
  </section>
</div>

<script>
/* 음성 파일: audio 폴더에 voice1 / voice2 (선택: voice3) 이름으로 넣으면 자동으로 재생돼요.
   m4a, mp3, wav 중 아무거나 됩니다. 파일이 없으면 자막만 흘러가는 미리보기로 동작해요. */
const VOICES = ["audio/voice1", "audio/voice2", "audio/voice3"];
const EXTS = [["m4a", "audio/mp4"], ["mp3", "audio/mpeg"], ["wav", "audio/wav"]];

const PLAY_ICON = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg>';
const PAUSE_ICON = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4.5" width="4" height="15" rx="1"/><rect x="14" y="4.5" width="4" height="15" rx="1"/></svg>';

const audios = VOICES.map(base => {
  const a = document.createElement("audio");
  a.preload = "auto";
  EXTS.forEach(([ext, type]) => {
    const s = document.createElement("source");
    s.src = `${base}.${ext}`; s.type = type;
    a.appendChild(s);
  });
  a.ok = false; a.failed = false;
  a.addEventListener("loadedmetadata", () => { a.ok = true; });
  a.lastElementChild.addEventListener("error", () => { a.failed = true; });
  document.body.appendChild(a);
  return a;
});

const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
const pad = s => `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(Math.floor(s % 60)).padStart(2, "0")}`;

// waveform bars
document.querySelectorAll(".wave").forEach((w, wi) => {
  const n = 34;
  for (let i = 0; i < n; i++) {
    const b = document.createElement("span");
    const h = 22 + Math.abs(Math.sin(i * 1.7 + wi * 3) * 60) + (i % 3) * 6;
    b.style.setProperty("--h", Math.min(100, h) + "%");
    b.style.setProperty("--d", (i % 7) * -0.13 + "s");
    w.appendChild(b);
  }
});
document.querySelectorAll(".play").forEach(p => p.innerHTML = PLAY_ICON);

// subtitles split into words for a gentle reveal
document.querySelectorAll(".sub").forEach(sub => {
  sub.innerHTML = sub.textContent.trim().split(/\s+/).map(w => `<span class="w">${w}</span>`).join(" ");
});

const screens = [...document.querySelectorAll(".screen")];
function show(id) {
  screens.forEach(s => s.classList.toggle("on", s.id === id));
}

// call timer
let callStart = 0, tick = null;
function startTimer() {
  callStart = Date.now();
  clearInterval(tick);
  tick = setInterval(() => {
    const t = pad((Date.now() - callStart) / 1000);
    document.querySelectorAll(".timer").forEach(el => el.textContent = t);
  }, 500);
}

// one voice section
function runVoice(section) {
  const idx = +section.dataset.voice;
  const a = audios[idx];
  const box = section.querySelector(".voice");
  const btn = section.querySelector(".play");
  const dur = section.querySelector(".dur");
  const words = [...section.querySelectorAll(".sub .w")];
  const replies = section.querySelector(".replies");
  let revealTimer = null, done = false;

  const finish = () => {
    if (done) return; done = true;
    words.forEach(w => w.classList.add("v"));
    replies.classList.add("show");
  };

  const reveal = (ms) => {
    clearInterval(revealTimer);
    let i = 0;
    const step = Math.max(120, ms / words.length);
    revealTimer = setInterval(() => {
      if (i < words.length) words[i++].classList.add("v");
      else clearInterval(revealTimer);
    }, step);
  };

  const setPlaying = on => {
    box.classList.toggle("playing", on);
    btn.innerHTML = on ? PAUSE_ICON : PLAY_ICON;
  };

  const fake = () => {        // no recording yet: let the subtitle carry it
    const ms = words.length * 330;
    setPlaying(true);
    dur.textContent = fmt(ms / 1000);
    reveal(ms);
    setTimeout(() => { setPlaying(false); finish(); }, ms + 300);
  };

  a.onplay = () => setPlaying(true);
  a.onpause = () => setPlaying(false);
  a.onended = () => { setPlaying(false); finish(); };
  a.ontimeupdate = () => { dur.textContent = fmt(Math.max(0, a.duration - a.currentTime) || 0); };

  btn.onclick = () => {
    if (a.ok) { a.paused ? a.play().catch(() => {}) : a.pause(); }
    else fake();
  };

  // play synchronously inside the tap that brought us here (needed on iPhone)
  if (a.failed) fake();
  else {
    let started = false;
    if (a.ok) a.currentTime = 0;
    a.play().then(() => {
      started = true;
      reveal((a.duration || 6) * 1000 * 0.9);
    }).catch(() => { if (!started) { started = true; fake(); } });
    // still loading and nothing happened: don't wait forever
    setTimeout(() => { if (!started) { started = true; a.pause(); fake(); } }, 2500);
  }
  // safety: never leave her stuck
  setTimeout(finish, 25000);

  return () => { a.pause(); clearInterval(revealTimer); };
}

let stopCurrent = () => {};
function goVoice(id) {
  stopCurrent();
  const sec = document.getElementById(id);
  sec.querySelectorAll(".sub .w").forEach(w => w.classList.remove("v"));
  sec.querySelector(".replies").classList.remove("show");
  sec.querySelectorAll(".chip").forEach(c => c.classList.remove("sent"));
  show(id);
  stopCurrent = runVoice(sec);
}

// screen 1
document.getElementById("btn-accept").onclick = () => {
  startTimer();
  goVoice("s-v1");
};
// declining is not really an option
let dodge = 0;
document.getElementById("btn-decline").onclick = e => {
  dodge++;
  const x = (dodge % 2 ? 1 : -1) * (18 + dodge * 6);
  e.currentTarget.style.transform = `translate(${x}px, ${-dodge * 4}px) rotate(${x}deg) scale(${Math.max(.6, 1 - dodge * .08)})`;
  document.querySelector(".accept-wrap").style.transform = `scale(${1 + Math.min(dodge, 4) * .08})`;
};

// reply chips
function wireReplies(sectionId, next) {
  document.querySelectorAll(`#${sectionId} .chip`).forEach(chip => {
    chip.onclick = () => {
      chip.classList.add("sent");
      next();
    };
  });
}
wireReplies("s-v1", () => goVoice("s-v2"));
wireReplies("s-v2", () => {
  stopCurrent(); stopCurrent = () => {};
  clearInterval(tick);
  document.getElementById("total").textContent = pad((Date.now() - callStart) / 1000);
  show("s-end");
  setupFinal();
});

// optional voice 3 on the note
function setupFinal() {
  const a = audios[2];
  const wrap = document.getElementById("final-player");
  if (!a.ok) { wrap.hidden = true; return; }
  wrap.hidden = false;
  const btn = wrap.querySelector(".play"), dur = wrap.querySelector(".dur");
  dur.textContent = fmt(a.duration || 0);
  const set = on => { wrap.classList.toggle("playing", on); btn.innerHTML = on ? PAUSE_ICON : PLAY_ICON; };
  a.onplay = () => set(true); a.onpause = () => set(false); a.onended = () => set(false);
  a.ontimeupdate = () => { dur.textContent = fmt(Math.max(0, a.duration - a.currentTime) || 0); };
  btn.onclick = () => { a.paused ? a.play().catch(() => {}) : a.pause(); };
  a.currentTime = 0;
  a.play().catch(() => {});
}

document.getElementById("btn-again").onclick = () => {
  audios.forEach(a => a.pause());
  dodge = 0;
  document.getElementById("btn-decline").style.transform = "";
  document.querySelector(".accept-wrap").style.transform = "";
  show("s-ring");
};
</script>
