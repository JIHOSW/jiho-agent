name: Publish HTML presentation

on:
  push:
    branches: [main]
    paths:
      - 'html 모션 ppt/dist/**'
      - '고객 온보딩 에이전트 포트폴리오/demo-dist/**'
      - 'ai 직군 적성검사 에이전트/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare presentation and preserve existing links
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/jiho-pages/html 모션 ppt/dist"
          cp -a "html 모션 ppt/dist/." "$RUNNER_TEMP/jiho-pages/"
          cp -a "html 모션 ppt/dist/." "$RUNNER_TEMP/jiho-pages/html 모션 ppt/dist/"
          # 고객 온보딩 에이전트 시연판(녹화본 재생 전용 정적 빌드)
          mkdir -p "$RUNNER_TEMP/jiho-pages/onboarding-agent"
          cp -a "고객 온보딩 에이전트 포트폴리오/demo-dist/." "$RUNNER_TEMP/jiho-pages/onboarding-agent/"
          # AI 직군 적성검사 에이전트(빌드 없는 정적 페이지)
          mkdir -p "$RUNNER_TEMP/jiho-pages/career-agent"
          cp -a "ai 직군 적성검사 에이전트/." "$RUNNER_TEMP/jiho-pages/career-agent/"
      - name: Upload presentation
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/jiho-pages
      - name: Deploy presentation
        id: deployment
        uses: actions/deploy-pages@v4
