name: Publish HTML presentation

on:
  push:
    branches: [main]
    paths:
      - 'html 모션 ppt/dist/**'
      - '고객 온보딩 에이전트 포트폴리오/demo-dist/**'
      - 'ai 직무적성검사/**'
      - '에이전트 팀 관제 대시보드/**'
      - 'B2B 영업제안서 html 모션 ppt/**'
      - '기술지원 티켓 에이전트/**'
      - '포트폴리오 html 모션 ppt/**'
      - 'apply/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare presentation and preserve existing links
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/jiho-pages/html 모션 ppt/dist"
          cp -a "html 모션 ppt/dist/." "$RUNNER_TEMP/jiho-pages/"
          cp -a "html 모션 ppt/dist/." "$RUNNER_TEMP/jiho-pages/html 모션 ppt/dist/"
          # 고객 온보딩 에이전트 시연판(녹화본 재생 전용 정적 빌드)
          mkdir -p "$RUNNER_TEMP/jiho-pages/onboarding-agent"
          cp -a "고객 온보딩 에이전트 포트폴리오/demo-dist/." "$RUNNER_TEMP/jiho-pages/onboarding-agent/"
          # AI 직무적성검사(빌드 없는 정적 페이지): 폴더 이름 그대로의 주소 + 짧은 주소(career-agent)
          mkdir -p "$RUNNER_TEMP/jiho-pages/ai 직무적성검사" "$RUNNER_TEMP/jiho-pages/career-agent"
          cp -a "ai 직무적성검사/." "$RUNNER_TEMP/jiho-pages/ai 직무적성검사/"
          cp -a "ai 직무적성검사/." "$RUNNER_TEMP/jiho-pages/career-agent/"
          # 에이전트 팀 관제 대시보드(단일 HTML): 짧은 주소(agent-switchboard)
          mkdir -p "$RUNNER_TEMP/jiho-pages/agent-switchboard"
          cp -a "에이전트 팀 관제 대시보드/." "$RUNNER_TEMP/jiho-pages/agent-switchboard/"
          # B2B 영업제안서 모션 HTML(단일 파일): 짧은 주소(b2b-proposal)
          mkdir -p "$RUNNER_TEMP/jiho-pages/b2b-proposal"
          cp "B2B 영업제안서 html 모션 ppt/대현테크_제안서_모션.html" "$RUNNER_TEMP/jiho-pages/b2b-proposal/index.html"
          # 기술지원 티켓 에이전트(단일 HTML): 짧은 주소(support-agent)
          mkdir -p "$RUNNER_TEMP/jiho-pages/support-agent"
          cp "기술지원 티켓 에이전트/index.html" "$RUNNER_TEMP/jiho-pages/support-agent/index.html"
          # 포트폴리오 모션 HTML(index.html + assets): 짧은 주소(portfolio)
          mkdir -p "$RUNNER_TEMP/jiho-pages/portfolio"
          cp -a "포트폴리오 html 모션 ppt/." "$RUNNER_TEMP/jiho-pages/portfolio/"
          # 회사별 입사지원 포트폴리오(지원서 스킬의 publish 결과): apply/<회사-직무>/
          if [ -d apply ]; then
            mkdir -p "$RUNNER_TEMP/jiho-pages/apply"
            cp -a "apply/." "$RUNNER_TEMP/jiho-pages/apply/"
          fi
      - name: Upload presentation
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/jiho-pages
      - name: Deploy presentation
        id: deployment
        uses: actions/deploy-pages@v4
